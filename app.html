<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KiixMotion Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    var akunRunningHub = [];
    var riwayatGenerateList = [];
    var navLayarAktif = 'dashboard';
    var RUNNINGHUB_WORKFLOW_ID = "2096475206973194241";

    function muatStorage() {
      try {
        var sRH = localStorage.getItem('km_rh_data');
        var sHist = localStorage.getItem('km_hist_data');
        if (sRH) akunRunningHub = JSON.parse(sRH);
        if (sHist) riwayatGenerateList = JSON.parse(sHist);
      } catch (e) { console.error(e); }
      sinkronkanDropdownAkunGenerate();
      updateStatistikDashboard();
    }

    function simpanStorage() {
      try {
        localStorage.setItem('km_rh_data', JSON.stringify(akunRunningHub));
        localStorage.setItem('km_hist_data', JSON.stringify(riwayatGenerateList));
      } catch (e) { console.error(e); }
      updateStatistikDashboard();
    }

    function gantiLayarNav(layar) {
      navLayarAktif = layar;
      var vDash = document.getElementById('layar-dashboard');
      var vGen = document.getElementById('layar-generate');
      var vHist = document.getElementById('layar-history');
      var vAkun = document.getElementById('layar-kelola-akun');

      if(vDash) vDash.style.display = 'none';
      if(vGen) vGen.style.display = 'none';
      if(vHist) vHist.style.display = 'none';
      if(vAkun) vAkun.style.display = 'none';

      if (layar === 'dashboard') {
        if(vDash) vDash.style.display = 'block';
        updateStatistikDashboard();
      } else if (layar === 'generate') {
        if(vGen) vGen.style.display = 'block';
      } else if (layar === 'history') {
        if(vHist) vHist.style.display = 'block';
        renderLayarHistory();
      } else if (layar === 'kelola-akun') {
        if(vAkun) vAkun.style.display = 'block';
        renderListAkunDiKelola();
      }
    }

    function updateStatistikDashboard() {
      var totalRhKoin = 0;
      for (var i = 0; i < akunRunningHub.length; i++) {
        totalRhKoin += Number(akunRunningHub[i].koin || 0);
      }
      var elRhKoin = document.getElementById('dash-rh-total-koin');
      if (elRhKoin) elRhKoin.innerText = totalRhKoin;
      var elStatSelesai = document.getElementById('dash-stat-video-selesai');
      if (elStatSelesai) elStatSelesai.innerText = riwayatGenerateList.length;
    }

    function sinkronkanDropdownAkunGenerate() {
      var sel = document.getElementById('sel-dropdown-akun');
      if (!sel) return;
      sel.innerHTML = '';
      if (akunRunningHub.length === 0) {
        var opt = document.createElement('option');
        opt.value = ""; opt.innerText = "Belum ada akun terhubung";
        sel.appendChild(opt);
      } else {
        for (var i = 0; i < akunRunningHub.length; i++) {
          var o = document.createElement('option');
          o.value = i;
          o.innerText = akunRunningHub[i].nama + " (" + akunRunningHub[i].koin + " koin)";
          sel.appendChild(o);
        }
      }
    }

    function fileTerpilihInput(input, txtId, tipe) {
      if (input.files && input.files[0]) {
        var elTxt = document.getElementById(txtId);
        if(elTxt) elTxt.innerText = input.files[0].name;
      }
    }

    async function uploadFileKeRunningHub(file, apiKey) {
      try {
        var formData = new FormData();
        formData.append("file", file);
        formData.append("apiKey", apiKey);
        var res = await fetch("https://www.runninghub.ai/task/openapi/upload", { method: "POST", body: formData });
        var json = await res.json();
        if (json && json.data && json.data.fileUrl) { return json.data.fileUrl; }
      } catch (e) { console.error("Gagal upload file:", e); }
      return null;
    }

    async function mulaiProsesGenerate() {
      if (akunRunningHub.length === 0) {
        alert('Hubungkan akun RunningHub terlebih dahulu di menu Akun!');
        gantiLayarNav('kelola-akun');
        return;
      }
      var sel = document.getElementById('sel-dropdown-akun');
      var idx = sel ? sel.value : 0;
      var akunAktif = akunRunningHub[idx !== "" ? parseInt(idx, 10) : 0];

      var inputFoto = document.querySelector('input[type="file"][accept="image/*"]');
      var fileFoto = inputFoto && inputFoto.files ? inputFoto.files[0] : null;
      var inputVideo = document.querySelector('input[type="file"][accept="video/*"]');
      var fileVideo = inputVideo && inputVideo.files ? inputVideo.files[0] : null;

      if (!fileFoto || !fileVideo) {
        alert('Harap pilih Foto Karakter dan Video Gerakan terlebih dahulu!');
        return;
      }

      var btn = document.getElementById('btn-submit-generate');
      if(btn) { btn.disabled = true; btn.innerText = "MENGUPLOAD FOTO..."; }

      try {
        var fotoUrl = await uploadFileKeRunningHub(fileFoto, akunAktif.key);
        if (!fotoUrl) throw new Error("Gagal mengunggah foto karakter.");

        if(btn) btn.innerText = "MENGUPLOAD VIDEO GERAKAN...";
        var videoUrlInput = await uploadFileKeRunningHub(fileVideo, akunAktif.key);
        if (!videoUrlInput) throw new Error("Gagal mengunggah video gerakan.");

        if(btn) btn.innerText = "MENGIRIM TASK GPU...";
        
        // Pemetaan node parameter presisi sesuai workflow MotionFly (Node 308/444 untuk foto, Node 128 untuk video pose)
        var nodeParams = [
          { nodeId: "3", fieldName: "text", fieldValue: "Follow reference video accurately, high quality." },
          { nodeId: "308", fieldName: "image", fieldValue: fotoUrl },
          { nodeId: "444", fieldName: "image", fieldValue: fotoUrl },
          { nodeId: "128", fieldName: "image", fieldValue: videoUrlInput }
        ];

        var res = await fetch('https://www.runninghub.ai/task/openapi/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey: akunAktif.key,
            workflowId: RUNNINGHUB_WORKFLOW_ID,
            nodeInfoList: nodeParams
          })
        });
        var data = await res.json();
        
        if (!data || !data.data || !data.data.taskId) {
          throw new Error(data.msg || "Gagal membuat task di RunningHub.");
        }

        var taskIdAsli = data.data.taskId;

        var tugasBaru = {
          id: taskIdAsli,
          model: "Wan Motion Control 1080HD",
          prov: "RunningHub",
          tgl: "Baru saja",
          biaya: "≈ 478 koin",
          videoUrl: null,
          status: "Sedang Render di GPU...",
          selesai: false
        };

        riwayatGenerateList.unshift(tugasBaru);
        simpanStorage();
        gantiLayarNav('history');
        if(btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; }

        var cekInterval = setInterval(async function() {
          try {
            var resStatus = await fetch('https://www.runninghub.ai/task/openapi/status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ apiKey: akunAktif.key, taskId: taskIdAsli })
            });
            var jsonStatus = await resStatus.json();
            if (jsonStatus && jsonStatus.data) {
              var st = jsonStatus.data.taskStatus;
              if (st === "SUCCESS") {
                clearInterval(cekInterval);
                tugasBaru.status = "Selesai"; tugasBaru.selesai = true;
                if (jsonStatus.data.fileUrlList && jsonStatus.data.fileUrlList.length > 0) {
                  tugasBaru.videoUrl = jsonStatus.data.fileUrlList[0];
                }
                simpanStorage();
                if (navLayarAktif === 'history') renderLayarHistory();
              } else if (st === "FAILED") {
                clearInterval(cekInterval);
                tugasBaru.status = "Gagal Dirender";
                simpanStorage();
                if (navLayarAktif === 'history') renderLayarHistory();
              }
            }
          } catch (err) { console.warn("Polling tertunda:", err); }
        }, 10000);

      } catch (e) {
        alert('Gagal: ' + e.message);
        if(btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; }
      }
    }

    function renderLayarHistory() {
      var wadah = document.getElementById('wadah-list-history');
      if(!wadah) return;
      wadah.innerHTML = '';
      if (riwayatGenerateList.length === 0) {
        wadah.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm border border-slate-200 rounded-2xl bg-white">Belum ada riwayat generate.</div>';
        return;
      }
      for (var i = 0; i < riwayatGenerateList.length; i++) {
        var itm = riwayatGenerateList[i];
        var isDone = itm.selesai === true && itm.videoUrl;
        var card = document.createElement('div');
        card.className = "bg-white border border-slate-200 p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3";
        card.innerHTML = '<div>' +
          '<div class="font-bold text-sm text-slate-900">' + itm.model + '</div>' +
          '<div class="text-xs text-slate-500 font-mono mt-0.5">ID: ' + itm.id + ' • <span class="text-amber-600 font-bold">' + itm.status + '</span></div>' +
        '</div>' +
        (isDone ? '<a href="' + itm.videoUrl + '" target="_blank" download class="px-4 py-2 bg-purple-600 text-white text-xs font-bold rounded-xl">Download Video</a>' : '<span class="text-xs text-slate-400 animate-pulse">Sedang Proses...</span>');
        wadah.appendChild(card);
      }
    }

    function renderListAkunDiKelola() {
      var wadah = document.getElementById('wadah-kartu-akun-list');
      if(!wadah) return;
      wadah.innerHTML = '';
      if (akunRunningHub.length === 0) {
        wadah.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm border border-slate-200 rounded-2xl bg-white">Belum ada akun. Klik tombol Tambah API Key di atas.</div>';
        return;
      }
      for (var i = 0; i < akunRunningHub.length; i++) {
        var el = document.createElement('div');
        el.className = "bg-white border border-slate-200 p-4 rounded-2xl flex items-center justify-between";
        el.innerHTML = '<span class="font-bold text-sm font-mono text-slate-800">' + akunRunningHub[i].nama + '</span>' +
        '<span class="font-black text-purple-600 font-mono text-sm">' + akunRunningHub[i].koin + ' koin</span>';
        wadah.appendChild(el);
      }
    }

    async function simpanAkunBaruDariModal() {
      var inLabel = document.getElementById('in-modal-label');
      var inKey = document.getElementById('in-modal-key');
      var valLabel = inLabel ? inLabel.value.trim() : "";
      var valKey = inKey ? inKey.value.trim() : "";
      if (!valKey) return alert('Masukkan API Key!');

      var saldoDidapat = 560;
      try {
        var res = await fetch('https://www.runninghub.ai/task/openapi/account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: valKey })
        });
        var hasil = await res.json();
        if (hasil && hasil.data && hasil.data.coins !== undefined) {
          saldoDidapat = Number(hasil.data.coins);
        }
      } catch (err) { console.warn(err); }

      akunRunningHub.push({ nama: valLabel || ("RunningHub #" + (akunRunningHub.length + 1)), key: valKey, koin: saldoDidapat });
      simpanStorage();
      document.getElementById('modal-popup-key').style.display = 'none';
      renderListAkunDiKelola();
      sinkronkanDropdownAkunGenerate();
      alert('Berhasil terhubung!');
    }

    window.onload = function() { muatStorage(); };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <header class="border-b border-slate-200 bg-white px-4 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="font-black text-base tracking-tight text-purple-700">KiixMotion Studio</div>
    <div class="flex gap-1.5">
      <button onclick="gantiLayarNav('dashboard')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-purple-600 text-white">Dashboard</button>
      <button onclick="gantiLayarNav('generate')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">Generate</button>
      <button onclick="gantiLayarNav('history')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">History</button>
      <button onclick="gantiLayarNav('kelola-akun')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">Akun</button>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">

    <!-- DASHBOARD -->
    <div id="layar-dashboard" class="space-y-4">
      <div class="bg-white border border-slate-200 p-5 rounded-2xl flex items-center justify-between">
        <div>
          <h2 class="font-bold text-lg">Total Kredit RunningHub</h2>
          <div id="dash-rh-total-koin" class="text-2xl font-black text-purple-600 font-mono mt-1">0</div>
        </div>
        <button onclick="gantiLayarNav('generate')" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-xl">Mulai Generate</button>
      </div>
      <div class="bg-white border border-slate-200 p-4 rounded-xl flex items-center justify-between text-sm">
        <span>Video Selesai Dirender:</span>
        <span id="dash-stat-video-selesai" class="font-black font-mono">0</span>
      </div>
    </div>

    <!-- GENERATE -->
    <div id="layar-generate" style="display: none;" class="space-y-4">
      <div class="bg-white border border-slate-200 p-5 rounded-2xl space-y-4">
        <h2 class="font-bold text-sm text-slate-800">1. Unggah Bahan</h2>
        <div class="grid grid-cols-2 gap-3">
          <label class="border-2 border-dashed border-slate-200 p-4 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer bg-slate-50">
            <span id="txt-file-foto" class="text-xs font-bold text-slate-700">Foto Karakter</span>
            <input type="file" accept="image/*" class="hidden" onchange="fileTerpilihInput(this, 'txt-file-foto', 'foto')" />
          </label>
          <label class="border-2 border-dashed border-slate-200 p-4 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer bg-slate-50">
            <span id="txt-file-video" class="text-xs font-bold text-slate-700">Video Gerakan</span>
            <input type="file" accept="video/*" class="hidden" onchange="fileTerpilihInput(this, 'txt-file-video', 'video')" />
          </label>
        </div>
      </div>

      <div class="bg-white border border-slate-200 p-5 rounded-2xl space-y-4">
        <h2 class="font-bold text-sm text-slate-800">2. Pilih Akun</h2>
        <select id="sel-dropdown-akun" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium">
          <option value="">Belum ada akun</option>
        </select>
        <button id="btn-submit-generate" onclick="mulaiProsesGenerate()" class="w-full py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm rounded-xl uppercase">
          GENERATE VIDEO
        </button>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="layar-history" style="display: none;" class="space-y-3">
      <h2 class="font-bold text-base">Riwayat Generate</h2>
      <div id="wadah-list-history" class="space-y-2"></div>
    </div>

    <!-- KELOLA AKUN -->
    <div id="layar-kelola-akun" style="display: none;" class="space-y-4">
      <div class="flex items-center justify-between bg-white border border-slate-200 p-4 rounded-2xl">
        <h2 class="font-bold text-base">Kelola Akun RunningHub</h2>
        <button onclick="document.getElementById('modal-popup-key').style.display='flex'" class="px-4 py-2 bg-purple-600 text-white text-xs font-bold rounded-xl">+ Tambah API Key</button>
      </div>
      <div id="wadah-kartu-akun-list" class="space-y-2"></div>
    </div>

  </main>

  <div id="modal-popup-key" style="display: none;" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white max-w-sm w-full p-5 rounded-2xl space-y-4">
      <h3 class="font-bold text-base">Tambah API Key</h3>
      <input id="in-modal-label" type="text" placeholder="Nama Akun (Cth: RunningHub #1)" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
      <input id="in-modal-key" type="password" placeholder="Paste API Key di sini..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
      <div class="flex gap-2">
        <button onclick="document.getElementById('modal-popup-key').style.display='none'" class="flex-1 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">Batal</button>
        <button onclick="simpanAkunBaruDariModal()" class="flex-1 py-2 bg-purple-600 text-white font-bold text-xs rounded-xl">Simpan</button>
      </div>
    </div>
  </div>

</body>
</html>
