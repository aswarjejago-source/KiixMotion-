<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiixMotion Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; background: #334155; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1d4ed8; }
        #status { font-weight: bold; color: #38bdf8; margin-top: 10px; }
        video { width: 100%; border-radius: 8px; margin-top: 10px; }
        .account-item { background: #334155; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- KELOLA AKUN / API KEY -->
    <div class="card">
        <h2>Kelola Akun API Key RunningHub</h2>
        
        <label>Tambah API Key Baru:</label>
        <input type="text" id="inputNewKey" placeholder="Tempel API Key di sini...">
        <button onclick="tambahApiKey()" style="background: #16a34a;">Simpan API Key</button>

        <h3>Daftar Akun Tersimpan:</h3>
        <div id="listAkun">Belum ada API Key yang ditambahkan.</div>
    </div>

    <!-- PANEL RENDER -->
    <div class="card">
        <h2>KiixMotion Render Panel</h2>
        
        <label>Pilih Akun API Key:</label>
        <select id="selectApiKey" onchange="pilihAkun()">
            <option value="">-- Pilih Akun --</option>
        </select>
        <div id="saldoInfo" style="font-size: 14px; color: #38bdf8; margin-bottom: 10px;">Saldo: -</div>

        <label>Workflow ID:</label>
        <input type="text" id="workflowId" value="2096475206973194241" placeholder="Masukkan Workflow ID">

        <label>URL Foto (Node 30):</label>
        <input type="text" id="imageUrl" placeholder="https://... URL gambar lu">

        <label>URL Video (Node 33):</label>
        <input type="text" id="videoUrl" placeholder="https://... URL video referensi lu">

        <button onclick="triggerRender()">Mulai Render</button>
        
        <div id="status">Status: Siap</div>
    </div>

    <!-- HASIL VIDEO -->
    <div class="card" id="resultContainer" style="display:none;">
        <h3>Hasil Render</h3>
        <video id="outputVideo" controls></video>
        <br>
        <a id="downloadLink" href="#" target="_blank"><button style="background: #16a34a; margin-top: 10px;">Download Video</button></a>
    </div>

<script>
let daftarAkun = JSON.parse(localStorage.getItem('kiix_accounts')) || [];

function renderAkun() {
    const select = document.getElementById('selectApiKey');
    const listDiv = document.getElementById('listAkun');
    
    select.innerHTML = '<option value="">-- Pilih Akun --</option>';
    listDiv.innerHTML = '';

    if (daftarAkun.length === 0) {
        listDiv.innerHTML = 'Belum ada API Key yang ditambahkan.';
        return;
    }

    daftarAkun.forEach((key, index) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = `Akun ${index + 1} (${key.substring(0, 6)}...${key.slice(-4)})`;
        select.appendChild(opt);

        const item = document.createElement('div');
        item.className = 'account-item';
        item.innerHTML = `
            <span><b>Akun ${index + 1}:</b> ${key.substring(0, 8)}...</span>
            <button onclick="hapusAkun(${index})" style="background: #dc2626; width: auto; padding: 6px 12px; margin: 0;">Hapus</button>
        `;
        listDiv.appendChild(item);
    });
}

function tambahApiKey() {
    const newKey = document.getElementById('inputNewKey').value.trim();
    if (!newKey) {
        alert("Masukkan API Key dengan benar, Bree!");
        return;
    }

    if (daftarAkun.includes(newKey)) {
        alert("API Key ini sudah pernah ditambahkan!");
        return;
    }

    daftarAkun.push(newKey);
    localStorage.setItem('kiix_accounts', JSON.stringify(daftarAkun));
    document.getElementById('inputNewKey').value = '';
    renderAkun();
    alert("API Key berhasil ditambahkan!");
}

function hapusAkun(index) {
    if (confirm("Yakin mau hapus API Key ini?")) {
        daftarAkun.splice(index, 1);
        localStorage.setItem('kiix_accounts', JSON.stringify(daftarAkun));
        renderAkun();
        document.getElementById('saldoInfo').innerText = "Saldo: -";
    }
}

function pilihAkun() {
    const selectedKey = document.getElementById('selectApiKey').value;
    if (selectedKey) {
        cekSaldo(selectedKey);
    } else {
        document.getElementById('saldoInfo').innerText = "Saldo: -";
    }
}

async function cekSaldo(apiKey) {
    const saldoInfo = document.getElementById('saldoInfo');
    saldoInfo.innerText = "Saldo: Mengecek koin...";

    try {
        const response = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'check_balance', apiKey })
        });

        const data = await response.json();
        if (response.ok) {
            saldoInfo.innerText = "Saldo / Koin: " + JSON.stringify(data);
        } else {
            saldoInfo.innerText = "Gagal cek saldo: " + (data.error || "Cek gagal");
        }
    } catch (error) {
        saldoInfo.innerText = "Error cek saldo: " + error.message;
    }
}

async function triggerRender() {
    const apiKey = document.getElementById('selectApiKey').value;
    const workflowId = document.getElementById('workflowId').value.trim();
    const imageUrl = document.getElementById('imageUrl').value.trim();
    const videoUrl = document.getElementById('videoUrl').value.trim();
    const statusEl = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    if (!apiKey) {
        alert("Pilih dulu Akun API Key yang mau dipakai, Bree!");
        return;
    }
    if (!workflowId || !imageUrl || !videoUrl) {
        alert("Workflow ID, URL Foto, dan URL Video wajib diisi!");
        return;
    }

    statusEl.innerText = "Status: Mengirim data ke server backend...";
    resultContainer.style.display = "none";

    try {
        const response = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'render', apiKey, workflowId, imageUrl, videoUrl })
        });

        const data = await response.json();

        if (response.ok && data.success !== false) {
            statusEl.innerText = "Status: Render Berhasil!";
            
            let videoResultUrl = "";
            if (data.results && data.results.length > 0) {
                const resItem = data.results.find(r => r.nodeId === "490") || data.results[0];
                videoResultUrl = resItem.url;
            }

            if (videoResultUrl) {
                outputVideo.src = videoResultUrl;
                downloadLink.href = videoResultUrl;
                resultContainer.style.display = "block";
            }
        } else {
            statusEl.innerText = "Status Gagal: " + (data.error || "Terjadi kesalahan");
        }
    } catch (error) {
        statusEl.innerText = "Status Error: " + error.message;
    }
}

window.onload = function() {
    renderAkun();
};
</script>

</body>
</html>
