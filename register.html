<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Masuk - KiixMotion Studio</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #08080A;
            color: #FAFAFA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* LATAR BELAKANG CAHAYA NEON ESTETIK (EFEK 3D DEPTH) */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.18) 0%, rgba(8, 8, 10, 0) 70%);
            top: 10%;
            left: 20%;
            z-index: 0;
            filter: blur(60px);
        }
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(8, 8, 10, 0) 70%);
            bottom: 10%;
            right: 20%;
            z-index: 0;
            filter: blur(60px);
        }

        /* KARTU UTAMA DENGAN EFEK 3D KACA MELAYANG */
        .card-3d-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            perspective: 1000px; /* Kunci efek 3D */
        }

        .auth-card {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(124, 58, 237, 0.15);
            transition: transform 0.1s ease-out, box-shadow 0.2s ease;
            transform-style: preserve-3d;
        }

        /* BRAND LOGO DI DALAM KARTU */
        .card-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 0.95em;
        }
        .logo-box {
            background-color: rgba(124, 58, 237, 0.2);
            color: #A78BFA;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; border-radius: 9px;
            border: 1px solid rgba(124, 58, 237, 0.4);
        }

        .form-header {
            margin-bottom: 25px;
        }
        .form-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.1em;
            margin-bottom: 6px;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }
        .form-header p {
            color: #9CA3AF;
            font-size: 0.88em;
        }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.82em;
            font-weight: 500;
            color: #D1D5DB;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-field {
            width: 100%;
            padding: 13px 16px;
            padding-right: 45px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.95em;
            background: rgba(0, 0, 0, 0.4);
            color: #FFFFFF;
            transition: all 0.2s ease;
            outline: none;
        }
        .input-field:focus {
            border-color: #7C3AED;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.25);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            padding: 0;
        }
        .toggle-password:hover { color: #FFFFFF; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.98em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .btn-submit:hover { 
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
            transform: translateY(-1px);
        }

        .form-footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85em;
            color: #9CA3AF;
        }
        .form-footer-link a {
            color: #A78BFA;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .form-footer-link a:hover { text-decoration: underline; }

        .back-home {
            display: inline-block;
            margin-bottom: 20px;
            color: #9CA3AF;
            text-decoration: none;
            font-size: 0.82em;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-home:hover { color: #FFFFFF; }
    </style>
</head>
<body>

    <div class="card-3d-wrapper" id="cardWrapper">
        <div class="auth-card" id="authCard">
            <a href="index.html" class="card-brand">
                <div class="logo-box">K</div>
                KiixMotion Studio
            </a>

            <a href="index.html" class="back-home">&larr; Kembali ke Beranda</a>
            
            <div class="form-header">
                <h1 id="form-heading">Masuk ke akun kamu</h1>
                <p id="form-subheading">Lanjut pakai email untuk mengakses studio.</p>
            </div>

            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="input-email" class="input-field" placeholder="nama@email.com">
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="input-pass" class="input-field" placeholder="Minimal 6 karakter">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                        <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="button" onclick="prosesAuthSupabase()" class="btn-submit" id="btn-text">Masuk</button>

            <div class="form-footer-link" id="switch-mode-box">
                Belum punya akun? <a onclick="switchMode('register')">Daftar gratis</a>
            </div>
        </div>
    </div>

    <!-- SDK SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://fybyupwcburndxulqqnn.supabase.co';
        const supabaseAnonKey = 'sb_publishable_6_w1SB8hk8tSzVtoIg4R3w_ZqXtoz2o';
        const supa = supabase.createClient(supabaseUrl, supabaseAnonKey);

        const urlParams = new URLSearchParams(window.location.search);
        let modeAktif = urlParams.get('mode') === 'register' ? 'register' : 'login';

        window.onload = function() {
            aturTampilanMode(modeAktif);
        };

        function switchMode(mode) {
            modeAktif = mode;
            aturTampilanMode(mode);
            const newUrl = mode === 'register' ? '?mode=register' : '?mode=login';
            window.history.pushState({}, '', newUrl);
        }

        function aturTampilanMode(mode) {
            const title = document.getElementById('page-title');
            const heading = document.getElementById('form-heading');
            const subheading = document.getElementById('form-subheading');
            const btnText = document.getElementById('btn-text');
            const switchBox = document.getElementById('switch-mode-box');

            if(mode === 'register') {
                title.innerText = "Daftar Akun Baru - KiixMotion Studio";
                heading.innerText = "Buat akun baru";
                subheading.innerText = "Buat akun KiixMotion untuk mulai membuat video.";
                btnText.innerText = "Daftar Sekarang";
                switchBox.innerHTML = `Sudah punya akun? <a onclick="switchMode('login')">Masuk di sini</a>`;
            } else {
                title.innerText = "Masuk - KiixMotion Studio";
                heading.innerText = "Masuk ke akun kamu";
                subheading.innerText = "Lanjut pakai email untuk mengakses studio.";
                btnText.innerText = "Masuk";
                switchBox.innerHTML = `Belum punya akun? <a onclick="switchMode('register')">Daftar gratis</a>`;
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('input-pass');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                passInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        async function prosesAuthSupabase() {
            const email = document.getElementById('input-email').value;
            const pass = document.getElementById('input-pass').value;
            const btnSubmit = document.getElementById('btn-text');

            if(!email || !pass) {
                alert('Isi email dan password dulu dong, Bree!');
                return;
            }

            const teksAsli = btnSubmit.innerText;
            btnSubmit.innerText = 'Memproses...';
            btnSubmit.disabled = true;

            try {
                if (modeAktif === 'register') {
                    const { data, error } = await supa.auth.signUp({ email, password: pass });
                    if (error) throw error;
                    
                    alert('Akun berhasil dibuat! Silakan Masuk.');
                    switchMode('login');
                    document.getElementById('input-pass').value = '';
                } else {
                    const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
                    if (error) throw error;
                    
                    window.location.href = 'studio.html';
                }
            } catch (error) {
                alert('Gagal: ' + error.message);
            } finally {
                btnSubmit.innerText = teksAsli;
                btnSubmit.disabled = false;
            }
        }

        /* EFEK 3D TILT (IKUT GERAKAN JARI / MOUSE) */
        const card = document.getElementById('authCard');
        const wrapper = document.getElementById('cardWrapper');

        wrapper.addEventListener('mousemove', (e) => {
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const rotateX = (-y / 15).toFixed(2);
            const rotateY = (x / 15).toFixed(2);
            
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        wrapper.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            card.style.transition = 'transform 0.5s ease';
        });

        wrapper.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });
    </script>
</body>
</html>
