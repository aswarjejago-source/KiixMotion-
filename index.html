<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KiixMotion Studio — AI Video & Image Generation Platform</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            kmBg: '#FBF9F5', kmCard: '#FFFFFF', kmBorder: '#EFECE6',
            kmTextPrimary: '#1A1816', kmTextSecondary: '#736B63',
            kmViolet: '#7C3AED', kmVioletHover: '#6D28D9', kmVioletLight: '#F3EEFF'
          }
        }
      }
    };
  </script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: #FBF9F5; color: #1A1816; }
    .modern-shadow { box-shadow: 0 10px 30px -5px rgba(26, 24, 22, 0.04), 0 4px 6px -2px rgba(26, 24, 22, 0.02); }
    .violet-glow { box-shadow: 0 8px 24px -4px rgba(124, 58, 237, 0.35); }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <script>
    var akunRunningHub = [], akunRoboneo = [], riwayatGenerateList = [];
    var navLayarAktif = 'dashboard', engineProvider = 'runninghub', tabAkunAktif = 'runninghub', isModePilih = false;
    var RUNNINGHUB_WORKFLOW_ID = "2095991824610615297";
    var linkTelegramResmi = "https://t.me/KiixMotionStudio";
    var urlBahanFoto = null, urlBahanVideo = null;
    var currentUserEmail = "aswar@kiixmotion.com";
    var pendingKonfirmasiFn = null;

    function muatStorage() {
      try {
        var sRH = localStorage.getItem('km_rh_data');
        var sRB = localStorage.getItem('km_rb_data');
        var sHist = localStorage.getItem('km_hist_data');
        if (sRH) akunRunningHub = JSON.parse(sRH);
        if (sRB) akunRoboneo = JSON.parse(sRB);
        if (sHist) riwayatGenerateList = JSON.parse(sHist);
      } catch (e) {}
      sinkronkanDropdownAkunGenerate(); updateStatistikDashboard(); gantiLayarNav(navLayarAktif);
    }

    function simpanStorage() {
      try {
        localStorage.setItem('km_rh_data', JSON.stringify(akunRunningHub));
        localStorage.setItem('km_rb_data', JSON.stringify(akunRoboneo));
        localStorage.setItem('km_hist_data', JSON.stringify(riwayatGenerateList));
      } catch (e) {}
      updateStatistikDashboard();
    }

    function tampilkanNotif(pesan, jenis) {
      var wadah = document.getElementById('toast-container');
      if (!wadah) return;
      var el = document.createElement('div');
      var warnaBg = jenis === 'error' ? 'bg-rose-600' : (jenis === 'sukses' ? 'bg-emerald-600' : 'bg-slate-900');
      el.className = 'animate-toast px-5 py-3 rounded-2xl shadow-xl font-bold text-xs sm:text-sm text-white flex items-center gap-2 mb-2 ' + warnaBg;
      el.innerHTML = '<span>' + (jenis === 'error' ? '⚠️' : (jenis === 'sukses' ? '✓' : 'ℹ️')) + '</span> <span>' + pesan + '</span>';
      wadah.appendChild(el);
      setTimeout(function() { el.remove(); }, 3500);
    }

    function gantiLayarNav(layar) {
      navLayarAktif = layar;
      var ids = ['dashboard', 'generate', 'history', 'kelola-akun'];
      ids.forEach(function(id) {
        var el = document.getElementById('layar-' + id);
        var btn = document.getElementById('menu-nav-' + id.slice(0, 4));
        if (el) el.style.display = (layar === id) ? 'block' : 'none';
        if (btn) btn.className = "px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer " + ((layar === id) ? "bg-kmViolet text-white violet-glow" : "text-kmTextSecondary hover:text-kmViolet");
      });
      if (layar === 'dashboard') updateStatistikDashboard();
      if (layar === 'history') renderLayarHistory();
      if (layar === 'kelola-akun') renderListAkunDiKelola();
    }

    function updateStatistikDashboard() {
      var totalRhKoin = 0, totalRbCarrots = 0;
      akunRunningHub.forEach(function(a) { totalRhKoin += Number(a.koin) || 0; });
      var setTxt = function(id, val) { var el = document.getElementById(id); if (el) el.innerText = val; };
      setTxt('dash-rh-total-koin', totalRhKoin); setTxt('dash-rh-total-akun', akunRunningHub.length);
      var emailDisp = document.getElementById('label-current-user-email');
      if (emailDisp && currentUserEmail) emailDisp.innerText = currentUserEmail;
    }

    function sinkronkanDropdownAkunGenerate() {
      var sel = document.getElementById('sel-dropdown-akun'), badge = document.getElementById('badge-total-saldo-gen');
      if (!sel) return; sel.innerHTML = '';
      if (akunRunningHub.length === 0) {
        sel.innerHTML = '<option value="">Belum ada akun terhubung (0 koin)</option>';
        if (badge) badge.innerText = "0 koin";
      } else {
        var total = 0;
        akunRunningHub.forEach(function(a, idx) {
          total += Number(a.koin) || 0;
          sel.innerHTML += '<option value="' + idx + '">' + a.nama + ' (' + a.koin + ' koin)</option>';
        });
        if (badge) badge.innerText = total + " koin";
      }
    }

    function renderListAkunDiKelola() {
      var wadah = document.getElementById('wadah-kartu-akun-list');
      if (!wadah) return; wadah.innerHTML = '';
      akunRunningHub.forEach(function(a, i) {
        wadah.innerHTML += '<div class="bg-white border border-kmBorder p-4 sm:p-5 rounded-2xl flex items-center justify-between modern-shadow">' +
          '<div class="flex items-center gap-3.5"><span class="text-sm sm:text-base font-bold text-kmTextPrimary font-mono">' + a.nama + '</span></div>' +
          '<div class="flex items-center gap-3"><span class="text-sm sm:text-base font-black text-kmViolet bg-violet-50 px-3 py-1 rounded-xl">' + (Number(a.koin) || 0) + ' koin</span>' +
          '<button onclick="hapusAkunSatu(' + i + ')" class="text-rose-500 text-xs font-bold">Hapus</button></div></div>';
      });
      if (akunRunningHub.length === 0) {
        wadah.innerHTML = '<div class="p-10 text-center text-slate-400 text-sm border-2 border-dashed border-kmBorder rounded-3xl">Belum ada akun terhubung.</div>';
      }
    }

    function hapusAkunSatu(idx) {
      if(confirm("Yakin ingin menghapus akun ini?")) {
        akunRunningHub.splice(idx, 1); simpanStorage(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate(); tampilkanNotif('Akun dihapus', 'sukses');
      }
    }

    function bukaModalFormKey() { document.getElementById('modal-popup-key').style.display = 'flex'; }
    function tutupModalFormKey() { document.getElementById('modal-popup-key').style.display = 'none'; }

    async function simpanAkunBaruDariModal() {
      var inKey = document.getElementById('in-modal-key');
      var valKey = inKey ? inKey.value.trim() : "";
      if (!valKey) return tampilkanNotif('Masukkan API Key terlebih dahulu!', 'error');
      if (akunRunningHub.find(function(a) { return a.key === valKey; })) return tampilkanNotif("API Key sudah ada!", 'error');

      var btnSimpan = document.getElementById('btn-simpan-key');
      if (btnSimpan) { btnSimpan.innerText = 'Menyinkronkan Koin...'; btnSimpan.disabled = true; }
      var saldoDidapat = 0;

      try {
        var res = await fetch('/api/saldo?apiKey=' + encodeURIComponent(valKey));
        var hasil = await res.json();
        
        if (res.ok && hasil.data) {
           var k = hasil.data.remainCoins !== undefined ? hasil.data.remainCoins : hasil.data.coins;
           saldoDidapat = (k !== undefined && k !== null) ? Number(k) : 1000;
           tampilkanNotif('✓ Akun terhubung!', 'sukses');
        } else {
           tampilkanNotif('Gagal tarik koin: ' + (hasil.msg || 'Akses ditolak'), 'error');
           if (btnSimpan) { btnSimpan.innerText = 'Simpan API Key'; btnSimpan.disabled = false; }
           return;
        }
      } catch (err) {
        tampilkanNotif('Gagal koneksi ke server Vercel.', 'error');
        if (btnSimpan) { btnSimpan.innerText = 'Simpan API Key'; btnSimpan.disabled = false; }
        return;
      }

      if (btnSimpan) { btnSimpan.innerText = 'Simpan API Key'; btnSimpan.disabled = false; }
      akunRunningHub.push({ nama: 'RunningHub #' + (akunRunningHub.length + 1), key: valKey, koin: saldoDidapat });
      simpanStorage(); tutupModalFormKey(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate();
    }

    window.onload = function() { muatStorage(); };
  </script>
</head>
<body class="selection:bg-kmViolet selection:text-white pb-14">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end pointer-events-none"></div>
  
  <header id="main-header-nav" class="border-b border-kmBorder bg-kmBg/90 backdrop-blur-md px-4 sm:px-8 py-3.5 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div>
        <span class="text-base font-black tracking-tight text-kmTextPrimary">KiixMotion Studio</span>
        <p class="text-[11px] text-kmTextSecondary font-medium">AI Motion Control Workbench</p>
      </div>
    </div>
    <nav class="flex items-center gap-2 bg-white/60 p-1 rounded-2xl border border-kmBorder">
      <button id="menu-nav-dash" onclick="gantiLayarNav('dashboard')" class="px-4 py-2 rounded-xl text-sm font-semibold transition cursor-pointer">Dashboard</button>
      <button id="menu-nav-gene" onclick="gantiLayarNav('generate')" class="px-4 py-2 rounded-xl text-sm font-semibold transition cursor-pointer">Generate</button>
      <button id="menu-nav-kelo" onclick="gantiLayarNav('kelola-akun')" class="px-4 py-2 rounded-xl text-sm font-semibold transition cursor-pointer">Kelola Akun</button>
    </nav>
  </header>

  <main id="view-workbench" class="max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
    <div id="layar-dashboard" style="display: none;" class="space-y-6">
      <h2 class="text-2xl font-black text-kmTextPrimary">Overview Studio</h2>
      <div class="bg-white border border-kmBorder p-5 rounded-3xl modern-shadow">
        <h3 class="text-sm font-bold text-kmTextPrimary">RunningHub</h3>
        <div id="dash-rh-total-koin" class="text-xl font-black text-kmViolet mt-2">0</div><div class="text-xs text-slate-400">Total Kredit</div>
      </div>
    </div>

    <div id="layar-generate" style="display: none;" class="space-y-6">
      <div class="bg-kmCard border border-kmBorder p-6 rounded-3xl modern-shadow">
        <h2 class="text-base font-bold text-kmTextPrimary">Pilih Akun Pemotong Saldo</h2>
        <select id="sel-dropdown-akun" class="w-full mt-3 bg-slate-50 border border-kmBorder rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-kmViolet"></select>
      </div>
    </div>

    <div id="layar-kelola-akun" style="display: none;" class="space-y-6">
      <div class="flex items-center justify-between bg-white p-6 rounded-3xl modern-shadow">
        <h2 class="text-xl font-bold text-kmTextPrimary">Akun Terhubung</h2>
        <button onclick="bukaModalFormKey()" class="px-5 py-2.5 bg-kmViolet text-white font-bold rounded-xl violet-glow">+ Tambah API Key</button>
      </div>
      <div id="wadah-kartu-akun-list" class="space-y-3"></div>
    </div>
  </main>

  <div id="modal-popup-key" style="display: none;" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white max-w-lg w-full p-8 rounded-3xl space-y-5 shadow-2xl">
      <h3 class="text-xl font-bold">Tambah API Key</h3>
      <input id="in-modal-key" type="password" placeholder="Tempel API Key di sini..." class="w-full bg-slate-50 border border-kmBorder rounded-2xl px-4 py-3.5 font-mono focus:border-kmViolet" />
      <div class="flex gap-3">
        <button onclick="tutupModalFormKey()" class="flex-1 py-3 bg-slate-100 font-bold rounded-2xl">Batal</button>
        <button id="btn-simpan-key" onclick="simpanAkunBaruDariModal()" class="flex-1 py-3 bg-kmViolet text-white font-bold rounded-2xl">Simpan</button>
      </div>
    </div>
  </div>
</body>
</html>
