<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiixMotion Direct Client</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; background: #334155; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1d4ed8; }
        #status { font-weight: bold; color: #38bdf8; margin-top: 10px; }
        video { width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>KiixMotion Render Panel</h2>
        
        <label>API Key RunningHub:</label>
        <input type="text" id="apiKey" value="88e79a44ded64b4a84a15b6d1bef72ac" placeholder="Masukkan API Key lu">

        <label>Workflow ID:</label>
        <input type="text" id="workflowId" value="2096475206973194241" placeholder="Masukkan Workflow ID">

        <label>URL Foto (Node 30):</label>
        <input type="text" id="imageUrl" placeholder="https://... URL gambar lu">

        <label>URL Video (Node 33):</label>
        <input type="text" id="videoUrl" placeholder="https://... URL video referensi lu">

        <button onclick="runWorkflow()">Mulai Render</button>
        
        <div id="status">Status: Siap</div>
    </div>

    <div class="card" id="resultContainer" style="display:none;">
        <h3>Hasil Render</h3>
        <video id="outputVideo" controls></video>
        <br>
        <a id="downloadLink" href="#" target="_blank"><button style="background: #16a34a; margin-top: 10px;">Download Video</button></a>
    </div>

<script>
async function runWorkflow() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const workflowId = document.getElementById('workflowId').value.trim();
    const imageUrl = document.getElementById('imageUrl').value.trim();
    const videoUrl = document.getElementById('videoUrl').value.trim();
    const statusEl = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    if (!apiKey || !workflowId || !imageUrl || !videoUrl) {
        alert("Isi dulu semua datanya dengan benar, Bree!");
        return;
    }

    statusEl.innerText = "Status: Mengirim request ke RunningHub...";
    resultContainer.style.display = "none";

    // Payload lengkap yang langsung mengikat inputan API Key dan URL asset lu
    const payload = {
        apiKey: apiKey,
        workflowId: workflowId,
        randomSeed: true,
        retainSeconds: 0,
        usePersonalQueue: false,
        nodeInfoList: [
            {
                nodeId: "30",
                fieldName: "image",
                fieldValue: imageUrl,
                description: "image"
            },
            {
                nodeId: "33",
                fieldName: "video",
                fieldValue: videoUrl,
                description: "video"
            }
        ]
    };

    try {
        const response = await fetch('https://www.runninghub.ai/openapi/v2/run/workflow/synchronous', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status === "SUCCESS" || data.taskId) {
            statusEl.innerText = "Status: Render Berhasil! Menyiapkan video...";
            
            let videoResultUrl = "";
            if (data.results && data.results.length > 0) {
                const resItem = data.results.find(r => r.nodeId === "490") || data.results[0];
                videoResultUrl = resItem.url;
            }

            if (videoResultUrl) {
                outputVideo.src = videoResultUrl;
                downloadLink.href = videoResultUrl;
                resultContainer.style.display = "block";
                statusEl.innerText = "Status: Selesai!";
            } else {
                statusEl.innerText = "Status: Task sukses tapi URL hasil belum muncul, Cek dashboard.";
            }
        } else {
            statusEl.innerText = "Status Gagal: " + (data.errorMessage || data.errorCode || "Unknown error");
        }
    } catch (error) {
        console.error(error);
        statusEl.innerText = "Status: Error koneksi atau diblokir CORS oleh browser.";
    }
}
</script>

</body>
</html>
