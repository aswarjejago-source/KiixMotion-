<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KiixMotion Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        colors: { kmBg: '#F8FAFC', kmCard: '#FFFFFF', kmBorder: '#E2E8F0', kmTextPrimary: '#0F172A', kmTextSecondary: '#64748B', kmViolet: '#7C3AED', kmVioletHover: '#6D28D9', kmVioletLight: '#F3EEFF' } } }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .modern-shadow { box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 4px 6px -2px rgba(15, 23, 42, 0.02); }
    .violet-glow { box-shadow: 0 8px 24px -4px rgba(124, 58, 237, 0.35); }
  </style>
  <script>
    var akunRunningHub = [], akunRoboneo = [], riwayatGenerateList = [];
    var navLayarAktif = 'dashboard', engineProvider = 'runninghub', tabAkunAktif = 'runninghub', isModePilih = false;
    var RUNNINGHUB_WORKFLOW_ID = "2096475206973194241";
    var linkTelegramResmi = "https://t.me/KiixMotionStudio";
    var userReferralCode = "KIIX-VIP" + Math.floor(100 + Math.random() * 900);
    var urlBahanFoto = null, urlBahanVideo = null;

    function muatStorage() {
      try {
        var sRH = localStorage.getItem('km_rh_data'), sRB = localStorage.getItem('km_rb_data');
        var sHist = localStorage.getItem('km_hist_data'), sRef = localStorage.getItem('km_my_ref_code');
        if (sRH) akunRunningHub = JSON.parse(sRH);
        if (sRB) akunRoboneo = JSON.parse(sRB);
        if (sHist) riwayatGenerateList = JSON.parse(sHist);
        if (sRef) { userReferralCode = sRef; } else { localStorage.setItem('km_my_ref_code', userReferralCode); }
      } catch (e) { console.error(e); }
      sinkronkanDropdownAkunGenerate(); updateStatistikDashboard();
      var elRef = document.getElementById('dash-ref-code-txt'); if (elRef) elRef.innerText = userReferralCode;
    }

    function simpanStorage() {
      try {
        localStorage.setItem('km_rh_data', JSON.stringify(akunRunningHub));
        localStorage.setItem('km_rb_data', JSON.stringify(akunRoboneo));
        localStorage.setItem('km_hist_data', JSON.stringify(riwayatGenerateList));
      } catch (e) { console.error(e); }
      updateStatistikDashboard();
    }

    function gantiLayarNav(layar) {
      navLayarAktif = layar;
      var ids = ['dashboard', 'generate', 'history', 'kelola-akun'];
      ids.forEach(function(id) {
        var el = document.getElementById('layar-' + id), btn = document.getElementById('menu-nav-' + id.slice(0, 4));
        if (el) el.style.display = (layar === id) ? 'block' : 'none';
        if (btn) btn.className = "px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer " +
          ((layar === id) ? "bg-kmViolet text-white violet-glow" : "text-kmTextSecondary hover:text-kmViolet hover:bg-slate-100/80");
      });
      if (layar === 'dashboard') updateStatistikDashboard();
      if (layar === 'history') renderLayarHistory();
      if (layar === 'kelola-akun') renderListAkunDiKelola();
    }

    function updateStatistikDashboard() {
      var totalRhKoin = 0, maxRhKoin = 0, totalRbCarrots = 0, maxRbCarrots = 0;
      akunRunningHub.forEach(function(a) { var k = Number(a.koin) || 0; totalRhKoin += k; if (k > maxRhKoin) maxRhKoin = k; });
      akunRoboneo.forEach(function(r) { var c = Number(r.koin) || 0; totalRbCarrots += c; if (c > maxRbCarrots) maxRbCarrots = c; });
      var setTxt = function(id, val) { var el = document.getElementById(id); if (el) el.innerText = val; };
      setTxt('dash-rh-total-koin', totalRhKoin); setTxt('dash-rh-total-akun', akunRunningHub.length + "/" + akunRunningHub.length);
      setTxt('dash-rh-max-koin', maxRhKoin); setTxt('dash-rb-total-carrots', totalRbCarrots);
      setTxt('dash-rb-total-akun', akunRoboneo.length + "/" + akunRoboneo.length); setTxt('dash-rb-max-carrots', maxRbCarrots);
      setTxt('dash-stat-video-selesai', riwayatGenerateList.filter(function(r){ return r.selesai; }).length);
    }

    function sinkronkanDropdownAkunGenerate() {
      var sel = document.getElementById('sel-dropdown-akun'), badge = document.getElementById('badge-total-saldo-gen');
      var targetAkun = (engineProvider === 'roboneo') ? akunRoboneo : akunRunningHub;
      if (!sel) return;
      sel.innerHTML = '';
      if (targetAkun.length === 0) {
        var opt = document.createElement('option'); opt.value = ""; opt.innerText = "Belum ada akun terhubung (0 koin)"; sel.appendChild(opt);
        if (badge) { badge.innerText = "0 koin"; badge.className = "text-xs font-mono text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg"; }
      } else {
        var optRand = document.createElement('option'); optRand.value = "random"; optRand.innerText = "🎲 Otomatis (Pilih Acak Akun)"; sel.appendChild(optRand);
        var total = 0;
        targetAkun.forEach(function(a, idx) {
          var koinVal = Number(a.koin) || 0;
          total += koinVal;
          var o = document.createElement('option'); o.value = idx; o.innerText = a.nama + " (" + koinVal + (engineProvider === 'roboneo' ? " carrots)" : " koin)"); sel.appendChild(o);
        });
        if (badge) {
          badge.innerText = total + (engineProvider === 'roboneo' ? " carrots" : " koin");
          badge.className = "text-xs font-mono font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg";
        }
      }
    }

    function gantiTabAkunProvider(prov) {
      tabAkunAktif = prov;
      var tRb = document.getElementById('tab-pilih-roboneo'), tRh = document.getElementById('tab-pilih-rh');
      var pRh = document.getElementById('panduan-rh-box'), pRb = document.getElementById('panduan-rb-box');
      if (tRh) tRh.className = (prov === 'runninghub') ? "px-5 py-2.5 rounded-xl bg-kmViolet text-white font-bold cursor-pointer text-sm violet-glow" : "px-5 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-slate-900 transition cursor-pointer text-sm font-semibold";
      if (tRb) tRb.className = (prov === 'roboneo') ? "px-5 py-2.5 rounded-xl bg-kmViolet text-white font-bold cursor-pointer text-sm violet-glow" : "px-5 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-slate-900 transition cursor-pointer text-sm font-semibold";
      if (pRh) pRh.style.display = (prov === 'runninghub') ? 'block' : 'none';
      if (pRb) pRb.style.display = (prov === 'roboneo') ? 'block' : 'none';
      renderListAkunDiKelola();
    }

    function renderListAkunDiKelola() {
      var wadah = document.getElementById('wadah-kartu-akun-list'), targetAkun = (tabAkunAktif === 'runninghub') ? akunRunningHub : akunRoboneo;
      if (!wadah) return;
      wadah.innerHTML = ''; var totalKredit = 0;
      targetAkun.forEach(function(a, i) {
        var koinVal = Number(a.koin) || 0;
        totalKredit += koinVal;
        var el = document.createElement('div');
        el.className = "bg-white border border-slate-200/80 p-4 sm:p-5 rounded-2xl flex items-center justify-between modern-shadow";
        el.innerHTML = '<div class="flex items-center gap-3.5"><span class="w-3 h-3 rounded-full bg-emerald-500 shrink-0 ring-4 ring-emerald-100"></span><span class="text-sm sm:text-base font-bold text-kmTextPrimary font-mono">' + a.nama + '</span></div><div class="flex items-center gap-3"><span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">Aktif</span><span class="text-sm sm:text-base font-black text-kmViolet font-mono bg-violet-50 px-3 py-1 rounded-xl">' + koinVal + (tabAkunAktif === 'roboneo' ? ' carrots' : ' koin') + '</span><button onclick="hapusAkunSatu(' + i + ')" class="text-rose-500 hover:text-rose-700 text-xs font-bold">Hapus</button></div>';
        wadah.appendChild(el);
      });
      var setTxt = function(id, v) { var el = document.getElementById(id); if (el) el.innerText = v; };
      setTxt('txt-stat-aktif', targetAkun.length); setTxt('txt-stat-akun', targetAkun.length); setTxt('txt-stat-kredit', totalKredit);
      if (targetAkun.length === 0) wadah.innerHTML = '<div class="p-10 text-center text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-3xl bg-white modern-shadow">Belum ada akun terhubung. Klik "+ Tambah API Key" di atas.</div>';
    }

    function hapusAkunSatu(idx) {
        var targetAkun = (tabAkunAktif === 'runninghub') ? akunRunningHub : akunRoboneo;
        if(confirm("Yakin hapus akun ini?")) {
            targetAkun.splice(idx, 1);
            simpanStorage(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate();
        }
    }

    function bukaModalFormKey() {
      var modal = document.getElementById('modal-popup-key');
      var inKey = document.getElementById('in-modal-key');
      if (inKey) inKey.value = ''; 
      if (modal) modal.style.display = 'flex';
    }
    
    function tutupModalFormKey() { 
        var modal = document.getElementById('modal-popup-key'); 
        if (modal) modal.style.display = 'none'; 
    }

    // FUNGSI DETEKTIF
    async function simpanAkunBaruDariModal() {
      var inKey = document.getElementById('in-modal-key');
      var valKey = inKey ? inKey.value.trim() : "";
      
      if (!valKey) return alert('Masukkan API Key terlebih dahulu!');
      
      var btnSimpan = document.getElementById('btn-simpan-key');
      if (btnSimpan) { btnSimpan.innerText = 'Mengintip Server...'; btnSimpan.disabled = true; }

      var targetAkun = (tabAkunAktif === 'runninghub') ? akunRunningHub : akunRoboneo;
      var namaAkun = (tabAkunAktif === 'runninghub' ? 'RunningHub #' : 'Roboneo #') + (targetAkun.length + 1);
      var saldoDidapat = 0;

      if (tabAkunAktif === 'runninghub') {
        try {
          // Kita tembak Vercel kita
          var res = await fetch('/api/saldo?apiKey=' + encodeURIComponent(valKey));
          
          // Kita paksa baca sebagai teks biasa (string) biar tau bentuk aslinya
          var textBalasan = await res.text();
          
          // POP-UP DETEKTIF: Tampilkan apapun balasan server!
          alert("🔍 CCTV SERVER MENDETEKSI:\n\n" + textBalasan);

          // Coba ubah teks jadi JSON
          var hasil = JSON.parse(textBalasan);

          if (hasil && hasil.data) {
            var k = hasil.data.remainCoins !== undefined ? hasil.data.remainCoins : (hasil.data.coins !== undefined ? hasil.data.coins : hasil.data.balance);
            if (k !== undefined && k !== null) saldoDidapat = Number(k);
          }
        } catch (err) {
          alert('❌ KONEKSI PUTUS: ' + err.message);
        }
      } else {
        saldoDidapat = 4;
      }

      if (btnSimpan) { btnSimpan.innerText = 'Simpan API Key'; btnSimpan.disabled = false; }

      targetAkun.push({ nama: namaAkun, key: valKey, koin: Number(saldoDidapat) });
      simpanStorage(); 
      tutupModalFormKey(); 
      renderListAkunDiKelola(); 
      sinkronkanDropdownAkunGenerate();
    }

    window.onload = function() { muatStorage(); setProviderUtama('runninghub'); };
    function setProviderUtama(p) { engineProvider = p; }
    function renderLayarHistory() {}
  </script>
</head>
<body class="bg-kmBg text-kmTextPrimary min-h-screen flex flex-col antialiased selection:bg-kmViolet selection:text-white pb-14">
  <header class="border-b border-slate-200/80 bg-white/90 backdrop-blur-md px-4 sm:px-8 py-3 flex flex-wrap items-center justify-between sticky top-0 z-40 gap-3">
    <div class="flex items-center gap-3">
      <div onclick="gantiLayarNav('dashboard')" class="relative w-10 h-10 flex items-center justify-center shrink-0 cursor-pointer">
        <svg class="w-10 h-10 drop-shadow-sm" viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="14" fill="#F3EEFF"/><path d="M14 10L22 22L14 34V10Z" fill="#7C3AED"/><path d="M22 22L30 10H22V22Z" fill="#A78BFA"/><path d="M22 22L30 34H22V22Z" fill="#6D28D9"/></svg>
      </div>
      <div><div class="flex items-center gap-2"><span class="text-base font-black tracking-tight text-slate-900">KiixMotion</span><span class="text-[9px] uppercase font-bold tracking-widest bg-violet-100 text-kmViolet px-2 py-0.5 rounded-full border border-violet-200">Studio</span></div></div>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button onclick="gantiLayarNav('dashboard')" id="menu-nav-dash" class="px-3.5 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100">Dash</button>
      <button onclick="gantiLayarNav('kelola-akun')" id="menu-nav-kelo" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-kmViolet text-white violet-glow">Akun</button>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <div id="layar-dashboard" style="display: none;">
        <p class="text-center text-slate-500 mt-10">Buka menu Akun untuk tes Detektif.</p>
    </div>

    <!-- Halaman Akun (Langsung terbuka untuk tes) -->
    <div id="layar-kelola-akun" class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200/80 modern-shadow">
        <div><h2 class="text-lg sm:text-xl font-bold text-kmTextPrimary">Tes Koin Otomatis</h2><p class="text-xs sm:text-sm text-kmTextSecondary mt-1">Gunakan ini untuk mengecek balasan server.</p></div>
        <div class="flex gap-2">
          <button id="tab-pilih-rh" class="px-5 py-2.5 rounded-xl bg-kmViolet text-white font-bold text-sm violet-glow">RunningHub</button>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-4 bg-white border border-slate-200/80 p-6 rounded-3xl modern-shadow">
        <div class="flex items-center gap-6 text-xs sm:text-sm font-mono">
          <div><span class="text-kmTextSecondary font-sans">Total Akun: </span><span id="txt-stat-akun" class="text-kmTextPrimary font-bold text-sm sm:text-base">0</span></div>
          <div><span class="text-kmTextSecondary font-sans">Total Koin: </span><span id="txt-stat-kredit" class="text-kmViolet font-bold text-sm sm:text-base">0</span></div>
        </div>
        <button onclick="bukaModalFormKey()" class="px-5 py-2.5 bg-kmViolet text-white text-xs sm:text-sm font-bold rounded-xl violet-glow">+ Tambah API Key</button>
      </div>
      <div id="wadah-kartu-akun-list" class="space-y-3"></div>
    </div>
  </main>

  <div id="modal-popup-key" style="display: none;" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 max-w-lg w-full p-6 sm:p-8 rounded-3xl space-y-5 shadow-2xl">
      <div class="flex items-center justify-between"><h3 class="text-lg font-bold text-kmTextPrimary">Tempel API Key</h3><button onclick="tutupModalFormKey()" class="text-slate-400 font-bold text-2xl p-1">✕</button></div>
      <div class="space-y-4 pt-2">
        <input id="in-modal-key" type="password" placeholder="sk-xxxx..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm font-mono focus:border-kmViolet focus:bg-white" />
      </div>
      <div class="flex gap-3 pt-3">
        <button id="btn-simpan-key" onclick="simpanAkunBaruDariModal()" class="flex-1 py-3.5 bg-kmViolet text-white font-bold rounded-2xl violet-glow">Jalankan Detektif</button>
      </div>
    </div>
  </div>
</body>
</html>
