<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KiixMotion Studio (v2.1) — AI Video Platform</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            kmBg: '#FBF9F5', kmCard: '#FFFFFF', kmBorder: '#EFECE6',
            kmTextPrimary: '#1A1816', kmTextSecondary: '#736B63',
            kmViolet: '#7C3AED', kmVioletHover: '#6D28D9',
            kmVioletLight: '#F3EEFF', kmAccent: '#D97706'
          }
        }
      }
    };
  </script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #FBF9F5;
      color: #1A1816;
    }
    .modern-shadow { box-shadow: 0 10px 30px -5px rgba(26, 24, 22, 0.04), 0 4px 6px -2px rgba(26, 24, 22, 0.02); }
    .violet-glow { box-shadow: 0 8px 24px -4px rgba(124, 58, 237, 0.35); }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <script>
    var akunRunningHub = [], akunRoboneo = [], riwayatGenerateList = [];
    var currentView = 'workbench', navLayarAktif = 'dashboard', engineProvider = 'runninghub', tabAkunAktif = 'runninghub', isModePilih = false;
    
    // WORKFLOW ID & NODE ID SESUAI SCREENSHOT
    var RUNNINGHUB_WORKFLOW_ID = "2097258183463436289"; 
    
    var linkTelegramResmi = "https://t.me/KiixMotionStudio";
    var urlBahanFoto = null, urlBahanVideo = null;
    var currentUserEmail = "aswar@kiixmotion.com";
    var pendingKonfirmasiFn = null;

    function muatStorage() {
      try {
        var sRH = localStorage.getItem('km_rh_data');
        var sRB = localStorage.getItem('km_rb_data');
        var sHist = localStorage.getItem('km_hist_data');
        if (sRH) akunRunningHub = JSON.parse(sRH);
        if (sRB) akunRoboneo = JSON.parse(sRB);
        if (sHist) riwayatGenerateList = JSON.parse(sHist);
      } catch (e) { console.error(e); }
      sinkronkanDropdownAkunGenerate();
      updateStatistikDashboard();
      aturTampilanHalamanUtama();
    }

    function simpanStorage() {
      try {
        localStorage.setItem('km_rh_data', JSON.stringify(akunRunningHub));
        localStorage.setItem('km_rb_data', JSON.stringify(akunRoboneo));
        localStorage.setItem('km_hist_data', JSON.stringify(riwayatGenerateList));
      } catch (e) { console.error(e); }
      updateStatistikDashboard();
    }

    function tampilkanNotif(pesan, jenis) {
      var wadah = document.getElementById('toast-container');
      if (!wadah) return;
      var el = document.createElement('div');
      var warnaBg = jenis === 'error' ? 'bg-rose-600 text-white' : (jenis === 'sukses' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-white');
      el.className = 'animate-toast px-5 py-3 rounded-2xl shadow-xl font-bold text-xs sm:text-sm flex items-center gap-2 mb-2 ' + warnaBg;
      el.innerHTML = '<span>' + (jenis === 'error' ? '⚠️' : (jenis === 'sukses' ? '✓' : 'ℹ️')) + '</span> <span>' + pesan + '</span>';
      wadah.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        el.style.transition = 'all 0.3s ease';
        setTimeout(function() { el.remove(); }, 300);
      }, (jenis === 'error' ? 6000 : 3500));
    }

    function aturTampilanHalamanUtama() {
      var vWorkbench = document.getElementById('view-workbench'), navHeader = document.getElementById('main-header-nav');
      if (vWorkbench) vWorkbench.style.display = 'block';
      if (navHeader) navHeader.style.display = 'flex';
      gantiLayarNav(navLayarAktif);
    }

    function mintaKonfirmasi(pesan, callbackYa) {
      var modal = document.getElementById('modal-konfirmasi-box'), txt = document.getElementById('modal-konfirmasi-teks');
      if (!modal || !txt) return;
      txt.innerText = pesan;
      pendingKonfirmasiFn = callbackYa;
      modal.style.display = 'flex';
    }

    function tutupModalKonfirmasi(apakahYa) {
      var modal = document.getElementById('modal-konfirmasi-box');
      if (modal) modal.style.display = 'none';
      if (apakahYa && typeof pendingKonfirmasiFn === 'function') pendingKonfirmasiFn();
      pendingKonfirmasiFn = null;
    }

    function gantiLayarNav(layar) {
      navLayarAktif = layar;
      var ids = ['dashboard', 'generate', 'history', 'kelola-akun'];
      ids.forEach(function(id) {
        var el = document.getElementById('layar-' + id), btn = document.getElementById('menu-nav-' + id.slice(0, 4));
        if (el) el.style.display = (layar === id) ? 'block' : 'none';
        if (btn) btn.className = "px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer " + ((layar === id) ? "bg-kmViolet text-white violet-glow" : "text-kmTextSecondary hover:text-kmViolet hover:bg-white/80");
      });
      if (layar === 'dashboard') updateStatistikDashboard();
      if (layar === 'history') renderLayarHistory();
      if (layar === 'kelola-akun') renderListAkunDiKelola();
    }

    function updateStatistikDashboard() {
      var totalRhKoin = 0, maxRhKoin = 0, totalRbCarrots = 0, maxRbCarrots = 0;
      akunRunningHub.forEach(function(a) { var k = Number(a.koin) || 0; totalRhKoin += k; if (k > maxRhKoin) maxRhKoin = k; });
      akunRoboneo.forEach(function(r) { var c = Number(r.koin) || 0; totalRbCarrots += c; if (c > maxRbCarrots) maxRbCarrots = c; });
      var setTxt = function(id, val) { var el = document.getElementById(id); if (el) el.innerText = val; };
      setTxt('dash-rh-total-koin', totalRhKoin); setTxt('dash-rh-total-akun', akunRunningHub.length); setTxt('dash-rh-max-koin', maxRhKoin);
      setTxt('dash-rb-total-carrots', totalRbCarrots); setTxt('dash-rb-total-akun', akunRoboneo.length); setTxt('dash-rb-max-carrots', maxRbCarrots);
      setTxt('dash-stat-video-selesai', riwayatGenerateList.filter(function(r) { return r.selesai; }).length);
      var emailDisp = document.getElementById('label-current-user-email');
      if (emailDisp && currentUserEmail) emailDisp.innerText = currentUserEmail;
    }

    function bukaGrupTelegram() { window.open(linkTelegramResmi, '_blank'); }

    function setProviderUtama(p) {
      engineProvider = p;
      var provs = ['runninghub', 'roboneo', 'kiix'];
      provs.forEach(function(pr) {
        var card = document.getElementById('c-prov-' + pr), badge = document.getElementById('b-prov-' + pr);
        if (card) card.className = (pr === p) ? "bg-white border-2 border-kmViolet p-5 rounded-2xl cursor-pointer modern-shadow ring-4 ring-violet-50 transition" : "bg-kmCard border border-kmBorder p-5 rounded-2xl cursor-pointer hover:border-violet-300 transition modern-shadow";
        if (badge) badge.style.display = (pr === p) ? 'inline-block' : 'none';
      });
      var setTxt = function(id, v) { var el = document.getElementById(id); if (el) el.innerText = v; };
      var dropWrap = document.getElementById('box-wrap-dropdown-akun');
      if (p === 'roboneo') {
        setTxt('t-engine-title', "KLING 2.6 MOTION CONTROL"); setTxt('t-engine-sub', "(ROBONEO)"); setTxt('t-engine-cost', "≈ 4 carrots"); setTxt('t-engine-total', "≈ 4 carrots");
        if (dropWrap) dropWrap.style.display = 'block';
      } else if (p === 'kiix') {
        setTxt('t-engine-title', "KIIXMOTION DIRECT CLOUD"); setTxt('t-engine-sub', "(DIRECT ENGINE)"); setTxt('t-engine-cost', "1 Kredit VIP"); setTxt('t-engine-total', "1 kredit VIP");
        if (dropWrap) dropWrap.style.display = 'none';
      } else {
        setTxt('t-engine-title', "WAN MOTION CONTROL 1080HD"); setTxt('t-engine-sub', "(RUNNINGHUB)"); setTxt('t-engine-cost', "≈ 478 kredit"); setTxt('t-engine-total', "≈ 478 kredit");
        if (dropWrap) dropWrap.style.display = 'block';
      }
      sinkronkanDropdownAkunGenerate();
    }

    function unggahBahanLangsung(input, tipe) {
      if (!input.files || !input.files[0]) return;
      var targetAkun = (engineProvider === 'roboneo') ? akunRoboneo : akunRunningHub;
      if (engineProvider !== 'kiix' && targetAkun.length === 0) {
        input.value = ""; return tampilkanNotif('Hubungkan akun di menu Kelola Akun!', 'error');
      }
      var sel = document.getElementById('sel-dropdown-akun'), idx = sel ? sel.value : "";
      var akunAktif = (idx === "random" || idx === "") ? targetAkun[0] : targetAkun[parseInt(idx, 10)];
      var file = input.files[0];
      var txtEl = document.getElementById(tipe === 'foto' ? 'txt-file-foto' : 'txt-file-video');
      var stEl = document.getElementById(tipe === 'foto' ? 'st-file-foto' : 'st-file-video');
      if (txtEl) txtEl.innerText = file.name;
      if (stEl) stEl.innerHTML = '<span class="text-amber-600 font-bold animate-pulse">⏳ 0%</span>';

      var formData = new FormData();
      formData.append("file", file);
      formData.append("apiKey", akunAktif.key);
      formData.append("fileType", tipe === 'foto' ? 'image' : 'video');

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "https://www.runninghub.ai/task/openapi/upload");
      xhr.setRequestHeader("Authorization", "Bearer " + akunAktif.key);
      
      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable && stEl) {
          var pct = Math.round((e.loaded / e.total) * 100);
          stEl.innerHTML = '<span class="text-amber-600 font-bold animate-pulse">⏳ ' + pct + '%</span>';
        }
      };
      
      xhr.onload = function() {
        try {
          var json = JSON.parse(xhr.responseText);
          var serverFile = null;
          
          if (json && json.data) {
             // PARSER DIPERBAIKI (Tangkep tipe String)
             if (typeof json.data === 'string') serverFile = json.data;
             else serverFile = json.data.fileName || json.data.fileUrl || json.data.url;
          }
          
          if (serverFile) {
            if (tipe === 'foto') urlBahanFoto = serverFile; else urlBahanVideo = serverFile;
            if (stEl) stEl.innerHTML = '<span class="text-emerald-600 font-bold">✓ Terunggah</span>';
            tampilkanNotif('File berhasil diunggah!', 'sukses');
          } else {
            throw new Error((json && json.msg) || "Format error dari server.");
          }
        } catch (err) {
          if (stEl) stEl.innerHTML = '<span class="text-rose-600 font-bold">❌ Gagal</span>';
          tampilkanNotif('Gagal unggah: ' + err.message, 'error');
        }
      };
      xhr.send(formData);
    }

    function sinkronkanDropdownAkunGenerate() {
      var sel = document.getElementById('sel-dropdown-akun'), badge = document.getElementById('badge-total-saldo-gen');
      var targetAkun = (engineProvider === 'roboneo') ? akunRoboneo : akunRunningHub;
      if (!sel) return;
      sel.innerHTML = '';
      if (targetAkun.length === 0) {
        var opt = document.createElement('option'); opt.value = ""; opt.innerText = "Belum ada akun (0 koin)"; sel.appendChild(opt);
        if (badge) { badge.innerText = "0 koin"; badge.className = "text-xs font-mono text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg"; }
      } else {
        var optRand = document.createElement('option'); optRand.value = "random"; optRand.innerText = "🎲 Otomatis (Pilih Acak)"; sel.appendChild(optRand);
        var total = 0;
        targetAkun.forEach(function(a, idx) {
          var koinVal = Number(a.koin) || 0; total += koinVal;
          var o = document.createElement('option'); o.value = idx; o.innerText = a.nama + " (" + koinVal + (engineProvider === 'roboneo' ? " carrots)" : " koin)"); sel.appendChild(o);
        });
        if (badge) {
          badge.innerText = total + (engineProvider === 'roboneo' ? " carrots" : " koin");
          badge.className = "text-xs font-mono font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg";
        }
      }
    }

    async function pantauTaskRunningHub(tugas, apiKey) {
      if(tugas.progress === undefined) tugas.progress = 0;

      var cekInterval = setInterval(async function() {
        try {
          var resStatus = await fetch('/api/cctv?taskId=' + tugas.id + '&apiKey=' + encodeURIComponent(apiKey));
          var jsonStatus = await resStatus.json();

          // SIMULASI PROGRESS BAR BIAR GA KOSONG (Naik 3-12% tiap 8 detik)
          if (tugas.progress < 95) {
             tugas.progress += Math.floor(Math.random() * 10) + 3; 
             if(tugas.progress > 98) tugas.progress = 98;
          }

          // PEMBUNUH BUG (Nangkap error JSON asli lu)
          if (jsonStatus && (jsonStatus.errorMessage || jsonStatus.failedReason || jsonStatus.error)) {
            clearInterval(cekInterval);
            var pesanAsli = "Gagal Render.";
            
            if (jsonStatus.failedReason && jsonStatus.failedReason.exception_message) {
               pesanAsli = jsonStatus.failedReason.exception_message;
               var nodeP = jsonStatus.failedReason.node_id || "?";
               tugas.status = "Gagal (Node " + nodeP + "): " + pesanAsli.substring(0, 30);
            } else if (jsonStatus.errorMessage) {
               tugas.status = "Gagal: " + jsonStatus.errorMessage.substring(0, 30);
            }

            tugas.selesai = true;
            tugas.progress = null; // Matiin persentase
            simpanStorage();
            if (navLayarAktif === 'history') renderLayarHistory();
            tampilkanNotif('Render Ditolak GPU!', 'error');
            return;
          }
          
          // PENGECEKAN NORMAL KALAU LANCAR
          if (jsonStatus && jsonStatus.data) {
            var st = jsonStatus.data.taskStatus ? jsonStatus.data.taskStatus.toUpperCase() : "";
            
            if (st === "SUCCESS") {
              clearInterval(cekInterval);
              tugas.status = "Selesai";
              tugas.selesai = true;
              tugas.progress = 100;
              tugas.videoUrl = jsonStatus.data.fileUrl || (jsonStatus.data.outputs && jsonStatus.data.outputs[0] ? jsonStatus.data.outputs[0].fileUrl : null);
              simpanStorage();
              if (navLayarAktif === 'history') renderLayarHistory();
              tampilkanNotif('Render sukses!', 'sukses');
            } 
            else if (st === "FAILED" || st === "ERROR" || st.includes("FAIL")) {
              clearInterval(cekInterval);
              var errMsg = jsonStatus.data.errorMsg || jsonStatus.data.message || "GPU Crash";
              tugas.status = "Gagal: " + errMsg.substring(0, 30);
              tugas.selesai = true;
              tugas.progress = null;
              simpanStorage();
              if (navLayarAktif === 'history') renderLayarHistory();
            } else {
              // TETAP UPDATE PERSENTASE DI HISTORY SAAT RUNNING
              tugas.status = "Sedang Render (" + tugas.progress + "%)";
              simpanStorage();
              if (navLayarAktif === 'history') renderLayarHistory();
            }
          }
        } catch (err) { console.warn("CCTV polling pending:", err); }
      }, 8000);
    }

    async function mulaiProsesGenerate() {
      var targetAkun = (engineProvider === 'roboneo') ? akunRoboneo : akunRunningHub;
      if (engineProvider !== 'kiix' && targetAkun.length === 0) return tampilkanNotif('Hubungkan akun terlebih dahulu!', 'error');
      
      var sel = document.getElementById('sel-dropdown-akun'), idx = sel ? sel.value : "";
      var akunAktif = (idx === "random" || idx === "") ? targetAkun[0] : targetAkun[parseInt(idx, 10)];

      if (!urlBahanFoto || !urlBahanVideo) return tampilkanNotif('Foto dan Video harus selesai diunggah!', 'error');

      var btn = document.getElementById('btn-submit-generate');
      if (btn) { btn.disabled = true; btn.innerText = "⚡ MENGIRIM KE GPU..."; }

      if (engineProvider === 'runninghub') {
        try {
          var promptTxt = document.getElementById('in-prompt-gerak') ? document.getElementById('in-prompt-gerak').value.trim() : "";
          var promptFinal = promptTxt || "Follow the reference video.";

          // NODE ID SUDAH DIGANTI SESUAI SCREENSHOT
          var nodeParams = [
            { nodeId: "3", fieldName: "text", fieldValue: promptFinal }, 
            { nodeId: "33", fieldName: "video", fieldValue: urlBahanVideo }, // VIDEO SEKARANG KE PINTU 33
            { nodeId: "30", fieldName: "image", fieldValue: urlBahanFoto }   // FOTO SEKARANG KE PINTU 30
          ];

          var payloadGenerate = {
            workflowId: RUNNINGHUB_WORKFLOW_ID,
            apiKey: akunAktif.key,
            nodeInfoList: nodeParams
          };

          var res = await fetch('https://www.runninghub.ai/task/openapi/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + akunAktif.key },
            body: JSON.stringify(payloadGenerate)
          });
          var data = await res.json();
          
          if (data && (data.code === 0 || data.data) && (data.data?.taskId || data.taskId)) { 
            var taskIdAsli = data.data?.taskId || data.taskId; 
            tampilkanNotif('Tugas dikirim! ID: ' + taskIdAsli, 'sukses');
            
            var tugasBaru = {
              id: taskIdAsli, key: akunAktif.key, model: "Wan Motion", prov: "RunningHub", tgl: "Baru saja", biaya: "≈ 478 kredit",
              videoUrl: null, status: "Sedang Render (0%)", selesai: false, progress: 0
            };
            
            riwayatGenerateList.unshift(tugasBaru); simpanStorage(); gantiLayarNav('history');
            if (btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; }
            
            pantauTaskRunningHub(tugasBaru, akunAktif.key);
          } else { 
            var pesanErrorAsli = data.msg || JSON.stringify(data);
            tampilkanNotif('GAGAL: ' + pesanErrorAsli, 'error');
            if (btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; } 
          }
        } catch (e) { 
          tampilkanNotif('Koneksi Gagal: ' + e.message, 'error'); 
          if (btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; } 
        }
      }
    }

    function renderLayarHistory() {
      var wadah = document.getElementById('wadah-list-history'), counter = document.getElementById('txt-counter-history');
      if (!wadah) return;
      wadah.innerHTML = '';
      if (counter) counter.innerText = riwayatGenerateList.length + " tugas";
      if (riwayatGenerateList.length === 0) {
        wadah.innerHTML = '<div class="p-12 text-center text-slate-400 text-sm border-2 border-dashed border-kmBorder rounded-3xl bg-white modern-shadow">Belum ada riwayat.</div>'; return;
      }
      riwayatGenerateList.forEach(function(itm) {
        var isDone = (itm.selesai === true || itm.status === "Selesai" || itm.status.includes("Gagal") || itm.status.includes("Error")), hasVideo = Boolean(itm.videoUrl);
        var card = document.createElement('div');
        card.className = "bg-white border border-kmBorder p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 modern-shadow";
        
        var iconStat = '⏳';
        if (hasVideo) iconStat = '▶'; else if (isDone) iconStat = '❌';

        var badgeStatusHTML = '';
        if (isDone) {
           if (hasVideo) {
              badgeStatusHTML = '<span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">✓ Selesai 100%</span>' +
              '<button type="button" onclick="window.open(\'' + itm.videoUrl + '\', \'_blank\')" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition cursor-pointer">Putar</button>' +
              '<a href="' + itm.videoUrl + '" target="_blank" download="kiixmotion-' + itm.id + '.mp4" class="px-4 py-2 text-xs font-bold bg-kmViolet text-white rounded-xl hover:bg-kmVioletHover transition violet-glow">Download</a>';
           } else {
              badgeStatusHTML = '<span class="text-xs bg-rose-50 text-rose-700 border border-rose-200 px-3 py-1 rounded-full font-bold">' + itm.status + '</span>';
           }
        } else {
           // SHOW PROGRESS BAR PERCENTAGE
           var stText = itm.status;
           if (itm.progress !== undefined && itm.progress !== null) stText = "⏳ Render GPU... " + itm.progress + "%";
           badgeStatusHTML = '<span class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full font-bold animate-pulse">' + stText + '</span>';
        }

        card.innerHTML = '<div class="flex items-center gap-4">' +
          '<div class="w-12 h-12 rounded-2xl bg-kmVioletLight text-kmViolet flex items-center justify-center font-bold text-lg shrink-0 shadow-sm">' + iconStat + '</div>' +
          '<div><div class="flex items-center gap-2"><span class="text-base font-bold text-kmTextPrimary">' + itm.model + '</span><span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full font-semibold border border-slate-200">' + itm.prov + '</span></div>' +
          '<div class="text-xs sm:text-sm text-kmTextSecondary mt-1">ID: <span class="text-kmViolet font-mono font-bold">' + itm.id + '</span> • ' + itm.tgl + '</div></div></div>' +
          '<div class="flex items-center gap-2.5 shrink-0 pt-2 sm:pt-0">' + badgeStatusHTML + '</div>';
        wadah.appendChild(card);
      });
    }

    function bersihkanSemuaHistory() {
      if (riwayatGenerateList.length === 0) return;
      mintaKonfirmasi('Hapus seluruh riwayat?', function() { riwayatGenerateList = []; simpanStorage(); renderLayarHistory(); });
    }

    function gantiTabAkunProvider(prov) {
      tabAkunAktif = prov;
      var tRb = document.getElementById('tab-pilih-roboneo'), tRh = document.getElementById('tab-pilih-rh');
      if (tRh) tRh.className = (prov === 'runninghub') ? "px-5 py-2.5 rounded-xl bg-kmViolet text-white font-bold cursor-pointer text-sm violet-glow" : "px-5 py-2.5 rounded-xl bg-white border border-kmBorder text-slate-600 hover:text-slate-900 transition cursor-pointer text-sm font-semibold";
      if (tRb) tRb.className = (prov === 'roboneo') ? "px-5 py-2.5 rounded-xl bg-kmViolet text-white font-bold cursor-pointer text-sm violet-glow" : "px-5 py-2.5 rounded-xl bg-white border border-kmBorder text-slate-600 hover:text-slate-900 transition cursor-pointer text-sm font-semibold";
      if (isModePilih) toggleModePilihHapus();
      renderListAkunDiKelola();
    }

    function renderListAkunDiKelola() {
      var wadah = document.getElementById('wadah-kartu-akun-list'), targetAkun = (tabAkunAktif === 'runninghub') ? akunRunningHub : akunRoboneo;
      if (!wadah) return;
      wadah.innerHTML = ''; var totalKredit = 0;
      targetAkun.forEach(function(a, i) {
        var koinVal = Number(a.koin) || 0; totalKredit += koinVal;
        var el = document.createElement('div'); el.className = "bg-white border border-kmBorder p-4 sm:p-5 rounded-2xl flex items-center justify-between modern-shadow";
        el.innerHTML = '<div class="flex items-center gap-3.5"><input type="checkbox" data-idx="' + i + '" class="chk-seleksi-akun ' + (isModePilih ? '' : 'hidden') + ' w-5 h-5 rounded-lg accent-kmViolet cursor-pointer" /><span class="w-3 h-3 rounded-full bg-emerald-500 shrink-0 ring-4 ring-emerald-100"></span><span class="text-sm sm:text-base font-bold text-kmTextPrimary font-mono">' + a.nama + '</span></div>' +
          '<div class="flex items-center gap-3"><span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">Aktif</span><span class="text-sm sm:text-base font-black text-kmViolet font-mono bg-violet-50 px-3 py-1 rounded-xl">' + koinVal + (tabAkunAktif === 'roboneo' ? ' carrots' : ' koin') + '</span><button onclick="hapusAkunSatu(' + i + ')" class="text-rose-500 hover:text-rose-700 text-xs font-bold font-sans">Hapus</button></div>';
        wadah.appendChild(el);
      });
      var setTxt = function(id, v) { var el = document.getElementById(id); if (el) el.innerText = v; };
      setTxt('txt-stat-aktif', targetAkun.length); setTxt('txt-stat-akun', targetAkun.length); setTxt('txt-stat-kredit', totalKredit);
      if (targetAkun.length === 0) wadah.innerHTML = '<div class="p-10 text-center text-slate-400 text-sm border-2 border-dashed border-kmBorder rounded-3xl bg-white modern-shadow">Belum ada akun terhubung. Klik "+ Tambah API Key" di atas.</div>';
    }

    function hapusAkunSatu(idx) {
      var targetAkun = (tabAkunAktif === 'runninghub') ? akunRunningHub : akunRoboneo;
      mintaKonfirmasi("Hapus akun ini?", function() { targetAkun.splice(idx, 1); simpanStorage(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate(); });
    }

    function toggleModePilihHapus() {
      isModePilih = !isModePilih;
      var btn = document.getElementById('btn-toggle-pilih'), bar = document.getElementById('bar-aksi-hapus'), chks = document.querySelectorAll('.chk-seleksi-akun');
      if (btn) { btn.innerText = isModePilih ? 'Batal' : 'Pilih'; btn.className = isModePilih ? "px-4 py-2 bg-rose-50 text-rose-600 text-sm font-bold rounded-xl border border-rose-200 cursor-pointer" : "px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold rounded-xl transition cursor-pointer"; }
      if (bar) bar.style.display = isModePilih ? 'flex' : 'none';
      chks.forEach(function(c) { if (isModePilih) c.classList.remove('hidden'); else { c.checked = false; c.classList.add('hidden'); } });
    }

    function centangSemuaAkun(master) { document.querySelectorAll('.chk-seleksi-akun').forEach(function(c) { c.checked = master.checked; }); }

    function eksekusiHapusAkun() {
      var checkedBoxes = document.querySelectorAll('.chk-seleksi-akun:checked');
      if (checkedBoxes.length === 0) return;
      mintaKonfirmasi('Hapus ' + checkedBoxes.length + ' akun?', function() {
        var targetAkun = (tabAkunAktif === 'runninghub') ? akunRunningHub : akunRoboneo, toDel = [];
        checkedBoxes.forEach(function(c) { toDel.push(parseInt(c.getAttribute('data-idx'), 10)); });
        toDel.sort(function(a, b) { return b - a; }).forEach(function(idx) { targetAkun.splice(idx, 1); });
        simpanStorage(); toggleModePilihHapus(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate();
      });
    }

    function bukaModalFormKey() { var m = document.getElementById('modal-popup-key'), k = document.getElementById('in-modal-key'); if (k) k.value = ''; if (m) m.style.display = 'flex'; }
    function tutupModalFormKey() { var m = document.getElementById('modal-popup-key'); if (m) m.style.display = 'none'; }

    async function simpanAkunBaruDariModal() {
      var inKey = document.getElementById('in-modal-key'), valKey = inKey ? inKey.value.trim() : "";
      if (!valKey) return tampilkanNotif('Masukkan API Key!', 'error');
      var targetAkun = (tabAkunAktif === 'runninghub') ? akunRunningHub : akunRoboneo;
      if (targetAkun.find(function(a) { return a.key === valKey; })) return tampilkanNotif("API Key sudah ada!", 'error');
      var btnSimpan = document.getElementById('btn-simpan-key');
      if (btnSimpan) { btnSimpan.innerText = 'Menyinkronkan...'; btnSimpan.disabled = true; }

      var saldoDidapat = 0;
      if (tabAkunAktif === 'runninghub') {
        try {
          var res = await fetch('/api/saldo?apiKey=' + encodeURIComponent(valKey));
          var hasil = await res.json();
          if (hasil && hasil.data) {
            var k = hasil.data.remainCoins !== undefined ? hasil.data.remainCoins : (hasil.data.coins !== undefined ? hasil.data.coins : hasil.data.balance);
            if (k !== undefined && k !== null) saldoDidapat = Number(k);
          }
        } catch (err) { }
      } else { saldoDidapat = 4; }

      if (btnSimpan) { btnSimpan.innerText = 'Simpan API Key'; btnSimpan.disabled = false; }
      targetAkun.push({ nama: (tabAkunAktif === 'runninghub' ? 'RunningHub #' : 'Roboneo #') + (targetAkun.length + 1), key: valKey, koin: Number(saldoDidapat) });
      simpanStorage(); tutupModalFormKey(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate();
      tampilkanNotif('Akun terhubung!', 'sukses');
    }

    window.onload = function() { muatStorage(); setProviderUtama('runninghub'); };
  </script>
</head>

<body class="selection:bg-kmViolet selection:text-white pb-14">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end pointer-events-none"></div>

  <header id="main-header-nav" class="border-b border-kmBorder bg-kmBg/90 backdrop-blur-md px-4 sm:px-8 py-3.5 flex flex-wrap items-center justify-between sticky top-0 z-40 gap-3">
    <div class="flex items-center gap-3">
      <div onclick="gantiLayarNav('dashboard')" class="relative w-10 h-10 flex items-center justify-center shrink-0 cursor-pointer">
        <svg class="w-10 h-10 drop-shadow-sm" viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="14" fill="#F3EEFF"/><path d="M14 10L22 22L14 34V10Z" fill="#7C3AED"/><path d="M22 22L30 10H22V22Z" fill="#A78BFA"/><path d="M22 22L30 34H22V22Z" fill="#6D28D9"/></svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-base font-black tracking-tight text-kmTextPrimary">KiixMotion</span>
          <span class="text-[9px] uppercase font-bold tracking-widest bg-violet-100 text-kmViolet px-2 py-0.5 rounded-full border border-violet-200">Studio</span>
        </div>
      </div>
    </div>
    
    <nav class="flex items-center gap-1 sm:gap-2 bg-white/60 p-1 rounded-2xl border border-kmBorder">
      <button id="menu-nav-dash" onclick="gantiLayarNav('dashboard')" class="px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer">Dashboard</button>
      <button id="menu-nav-gene" onclick="gantiLayarNav('generate')" class="px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer">Generate</button>
      <button id="menu-nav-hist" onclick="gantiLayarNav('history')" class="px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer">History</button>
      <button id="menu-nav-kelo" onclick="gantiLayarNav('kelola-akun')" class="px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer">Kelola Akun</button>
    </nav>
  </header>

  <main id="view-workbench" class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- DASHBOARD VIEW -->
    <div id="layar-dashboard" style="display: none;" class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-kmTextPrimary">Overview Studio</h2>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-white border border-kmBorder p-5 rounded-3xl modern-shadow space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-xs">R</div>
              <div><h3 class="text-sm font-bold text-kmTextPrimary">RunningHub</h3><p class="text-[11px] text-slate-400">Motion Control</p></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 border-y border-kmBorder py-3 text-center">
            <div><div id="dash-rh-total-koin" class="text-xl font-black text-kmViolet font-mono">0</div><div class="text-[10px] text-slate-400 uppercase font-semibold">Total Kredit</div></div>
            <div><div id="dash-rh-total-akun" class="text-xl font-bold text-slate-800 font-mono">0</div><div class="text-[10px] text-slate-400 uppercase font-semibold">Akun Aktif</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- GENERATE VIEW -->
    <div id="layar-generate" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-kmCard border border-kmBorder p-6 rounded-3xl space-y-5 modern-shadow">
          <h2 class="text-base font-bold text-kmTextPrimary flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-kmViolet"></span> 1. Bahan Input
          </h2>
          <div id="v-mode-upload" class="grid grid-cols-2 gap-4">
            <label class="border-2 border-dashed border-kmBorder hover:border-kmViolet rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer transition bg-slate-50/50 hover:bg-violet-50/20 group">
              <span class="text-4xl mb-2 group-hover:scale-105 transition">🖼️</span>
              <span id="txt-file-foto" class="text-xs sm:text-sm font-bold text-kmTextPrimary">Foto Karakter</span>
              <span id="st-file-foto" class="text-[11px] text-slate-400 mt-1">Klik untuk upload</span>
              <input id="input-file-foto" type="file" accept="image/*" class="hidden" onchange="unggahBahanLangsung(this, 'foto')" />
            </label>

            <label class="border-2 border-dashed border-kmBorder hover:border-kmViolet rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer transition bg-slate-50/50 hover:bg-violet-50/20 group">
              <span class="text-4xl mb-2 group-hover:scale-105 transition">🎬</span>
              <span id="txt-file-video" class="text-xs sm:text-sm font-bold text-kmTextPrimary">Video Gerakan</span>
              <span id="st-file-video" class="text-[11px] text-slate-400 mt-1">Klik untuk upload</span>
              <input id="input-file-video" type="file" accept="video/*" class="hidden" onchange="unggahBahanLangsung(this, 'video')" />
            </label>
          </div>
        </div>

        <div class="bg-kmCard border border-kmBorder p-6 rounded-3xl flex flex-col justify-between space-y-6 modern-shadow">
          <div class="space-y-5">
            <h2 class="text-base font-bold text-kmTextPrimary flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-kmViolet"></span> 2. Akun & Estimasi
            </h2>
            <div id="box-wrap-dropdown-akun" class="space-y-2">
              <select id="sel-dropdown-akun" class="w-full bg-slate-50 border border-kmBorder rounded-2xl px-4 py-3.5 text-sm sm:text-base text-kmTextPrimary font-medium focus:outline-none focus:border-kmViolet focus:bg-white cursor-pointer">
                <option value="">Belum ada akun terhubung</option>
              </select>
            </div>
          </div>
          <button id="btn-submit-generate" onclick="mulaiProsesGenerate()" class="w-full py-4 bg-kmViolet hover:bg-kmVioletHover text-white font-extrabold text-sm sm:text-base uppercase tracking-wider rounded-2xl violet-glow transition transform active:scale-95 cursor-pointer">
            GENERATE VIDEO
          </button>
        </div>
      </div>
    </div>

    <!-- HISTORY VIEW -->
    <div id="layar-history" style="display: none;" class="space-y-4">
      <div class="flex items-center justify-between bg-white p-6 rounded-3xl border border-kmBorder modern-shadow">
        <h2 class="text-lg sm:text-xl font-bold text-kmTextPrimary">Riwayat Generate Video</h2>
        <button onclick="bersihkanSemuaHistory()" class="text-xs sm:text-sm text-rose-500 font-bold cursor-pointer">Hapus Semua</button>
      </div>
      <div id="wadah-list-history" class="space-y-3"></div>
    </div>

    <!-- KELOLA AKUN VIEW -->
    <div id="layar-kelola-akun" style="display: none;" class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-kmBorder modern-shadow">
        <h2 class="text-lg sm:text-xl font-bold text-kmTextPrimary">Akun Terhubung (BYOK)</h2>
        <div class="flex gap-2">
          <button id="tab-pilih-rh" onclick="gantiTabAkunProvider('runninghub')" class="px-5 py-2.5 rounded-xl bg-kmViolet text-white font-bold cursor-pointer text-sm violet-glow">RunningHub</button>
          <button id="tab-pilih-roboneo" onclick="gantiTabAkunProvider('roboneo')" class="px-5 py-2.5 rounded-xl bg-white border border-kmBorder text-slate-600 transition cursor-pointer text-sm font-semibold">Roboneo</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-4 bg-white border border-kmBorder p-6 rounded-3xl modern-shadow">
        <div class="flex items-center gap-6 text-xs sm:text-sm font-mono">
          <div><span class="text-kmTextSecondary">Akun: </span><span id="txt-stat-akun" class="font-bold">0</span></div>
        </div>
        <div class="flex items-center gap-2.5">
          <button onclick="bukaModalFormKey()" class="px-5 py-2.5 bg-kmViolet hover:bg-kmVioletHover text-white text-xs sm:text-sm font-bold rounded-xl violet-glow transition cursor-pointer flex items-center gap-1.5">+ Tambah API Key</button>
        </div>
      </div>
      <div id="wadah-kartu-akun-list" class="space-y-3"></div>
    </div>
  </main>

  <!-- MODAL TAMBAH API KEY -->
  <div id="modal-popup-key" style="display: none;" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-kmBorder max-w-lg w-full p-6 sm:p-8 rounded-3xl space-y-5 shadow-2xl">
      <div class="flex items-center justify-between"><h3 class="text-lg font-bold">Tambah API Key</h3><button onclick="tutupModalFormKey()" class="text-slate-400 font-bold text-2xl">✕</button></div>
      <input id="in-modal-key" type="password" placeholder="Tempel API Key di sini..." class="w-full bg-slate-50 border border-kmBorder rounded-2xl px-4 py-3.5 focus:border-kmViolet" />
      <div class="flex gap-3 pt-3">
        <button onclick="tutupModalFormKey()" class="flex-1 py-3.5 bg-slate-100 font-bold rounded-2xl">Batal</button>

        <button onclick="tutupModalKonfirmasi(true)" class="flex-1 py-2.5 bg-rose-600 text-white font-bold rounded-xl">Ya</button>
      </div>
    </div>
