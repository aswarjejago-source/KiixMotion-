<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KiixMotion Studio (v6.0) — Verified Final Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            kmBg: '#FBF9F5', kmCard: '#FFFFFF', kmBorder: '#EFECE6',
            kmTextPrimary: '#1A1816', kmTextSecondary: '#736B63',
            kmViolet: '#7C3AED', kmVioletHover: '#6D28D9',
            kmVioletLight: '#F3EEFF', kmAccent: '#D97706'
          }
        }
      }
    };
  </script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; background-color: #FBF9F5; color: #1A1816; }
    .modern-shadow { box-shadow: 0 10px 30px -5px rgba(26, 24, 22, 0.04), 0 4px 6px -2px rgba(26, 24, 22, 0.02); }
    .violet-glow { box-shadow: 0 8px 24px -4px rgba(124, 58, 237, 0.35); }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <script>
    var akunRunningHub = [], riwayatGenerateList = [];
    var currentView = 'workbench', navLayarAktif = 'dashboard';
    
    // WORKFLOW ID RESMI YANG SUDAH TERVERIFIKASI
    var RUNNINGHUB_WORKFLOW_ID = "2087028464646303745"; 
    
    var urlBahanFoto = null, urlBahanVideo = null;
    var pendingKonfirmasiFn = null;

    function muatStorage() {
      try {
        var sRH = localStorage.getItem('km_rh_data');
        var sHist = localStorage.getItem('km_hist_data');
        if (sRH) akunRunningHub = JSON.parse(sRH);
        if (sHist) riwayatGenerateList = JSON.parse(sHist);
      } catch (e) {}
      sinkronkanDropdownAkunGenerate(); updateStatistikDashboard(); gantiLayarNav(navLayarAktif);
    }

    function simpanStorage() {
      try {
        localStorage.setItem('km_rh_data', JSON.stringify(akunRunningHub));
        localStorage.setItem('km_hist_data', JSON.stringify(riwayatGenerateList));
      } catch (e) {}
      updateStatistikDashboard();
    }

    function tampilkanNotif(pesan, jenis) {
      var wadah = document.getElementById('toast-container');
      if (!wadah) return;
      var el = document.createElement('div');
      var warnaBg = jenis === 'error' ? 'bg-rose-600 text-white' : (jenis === 'sukses' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-white');
      el.className = 'animate-toast px-5 py-3 rounded-2xl shadow-xl font-bold text-xs sm:text-sm flex items-center gap-2 mb-2 ' + warnaBg;
      el.innerHTML = '<span>' + (jenis === 'error' ? '⚠️' : (jenis === 'sukses' ? '✓' : 'ℹ️')) + '</span> <span>' + pesan + '</span>';
      wadah.appendChild(el);
      setTimeout(function() { el.remove(); }, 5000);
    }

    function mintaKonfirmasi(pesan, callbackYa) {
      document.getElementById('modal-konfirmasi-teks').innerText = pesan;
      pendingKonfirmasiFn = callbackYa;
      document.getElementById('modal-konfirmasi-box').style.display = 'flex';
    }

    function tutupModalKonfirmasi(apakahYa) {
      document.getElementById('modal-konfirmasi-box').style.display = 'none';
      if (apakahYa && typeof pendingKonfirmasiFn === 'function') pendingKonfirmasiFn();
      pendingKonfirmasiFn = null;
    }

    function gantiLayarNav(layar) {
      navLayarAktif = layar;
      var ids = ['dashboard', 'generate', 'history', 'kelola-akun'];
      ids.forEach(function(id) {
        var el = document.getElementById('layar-' + id), btn = document.getElementById('menu-nav-' + id.slice(0, 4));
        if (el) el.style.display = (layar === id) ? 'block' : 'none';
        if (btn) btn.className = "px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer " + ((layar === id) ? "bg-kmViolet text-white violet-glow" : "text-kmTextSecondary hover:text-kmViolet hover:bg-white/80");
      });
      if (layar === 'dashboard') updateStatistikDashboard();
      if (layar === 'history') renderLayarHistory();
      if (layar === 'kelola-akun') renderListAkunDiKelola();
    }

    function updateStatistikDashboard() {
      var totalRhKoin = 0;
      akunRunningHub.forEach(function(a) { totalRhKoin += (Number(a.koin) || 0); });
      var setTxt = function(id, val) { var el = document.getElementById(id); if (el) el.innerText = val; };
      setTxt('dash-rh-total-koin', totalRhKoin); 
      setTxt('dash-rh-total-akun', akunRunningHub.length); 
      setTxt('dash-stat-video-selesai', riwayatGenerateList.filter(function(r) { return r.selesai && !r.status.includes('Gagal'); }).length);
    }

    function unggahBahanLangsung(input, tipe) {
      if (!input.files || !input.files[0]) return;
      var akunAktif = akunRunningHub[0];
      if (!akunAktif) { input.value = ""; return tampilkanNotif('Hubungkan akun di menu Kelola Akun!', 'error'); }
      
      var file = input.files[0];
      var txtEl = document.getElementById(tipe === 'foto' ? 'txt-file-foto' : 'txt-file-video');
      var stEl = document.getElementById(tipe === 'foto' ? 'st-file-foto' : 'st-file-video');
      if (txtEl) txtEl.innerText = file.name;
      if (stEl) stEl.innerHTML = '<span class="text-amber-600 font-bold animate-pulse">⏳ Mengunggah...</span>';

      var formData = new FormData(); formData.append("file", file);
      var xhr = new XMLHttpRequest();
      
      xhr.open("POST", "https://www.runninghub.ai/openapi/v2/media/upload/binary");
      xhr.setRequestHeader("Authorization", "Bearer " + akunAktif.key);
      
      xhr.onload = function() {
        try {
          var json = JSON.parse(xhr.responseText);
          if (json && json.code === 0 && json.data) {
             // Tangkap URL lengkap publik sesuai temuan sukses terbaru
             var fileUrlPublik = json.data.download_url || json.data.url || json.data.fileName;
             if (!fileUrlPublik.startsWith('http')) {
                 fileUrlPublik = "https://rh-hk-images-switch.xiaoyaoyou.com/" + fileUrlPublik;
             }
             
             if (tipe === 'foto') urlBahanFoto = fileUrlPublik; else urlBahanVideo = fileUrlPublik;
             stEl.innerHTML = '<span class="text-emerald-600 font-bold">✓ Terunggah</span>';
          } else { throw new Error(json.message || "Gagal upload"); }
        } catch (err) {
          stEl.innerHTML = '<span class="text-rose-600 font-bold">❌ Gagal</span>';
          tampilkanNotif('Gagal upload: ' + err.message, 'error');
        }
      };
      xhr.send(formData);
    }

    function sinkronkanDropdownAkunGenerate() {
      var sel = document.getElementById('sel-dropdown-akun');
      if (!sel) return; sel.innerHTML = '';
      if (akunRunningHub.length === 0) {
        var opt = document.createElement('option'); opt.value = ""; opt.innerText = "Belum ada akun"; sel.appendChild(opt);
      } else {
        akunRunningHub.forEach(function(a, idx) {
          var o = document.createElement('option'); o.value = idx; o.innerText = a.nama + " (" + (Number(a.koin)||0) + " koin)"; sel.appendChild(o);
        });
      }
    }

    async function pantauTaskRunningHub(tugas, apiKey) {
      if(tugas.progress === undefined) tugas.progress = 0;

      var cekInterval = setInterval(async function() {
        try {
          var antiCache = new Date().getTime();
          var urlCek = '/api/cctv?taskId=' + tugas.id + '&apiKey=' + encodeURIComponent(apiKey) + '&_t=' + antiCache;
          
          var resStatus = await fetch(urlCek);
          var rawJson = await resStatus.json();

          if (rawJson.code && rawJson.code !== 0 && rawJson.code !== 200) {
              clearInterval(cekInterval);
              tugas.status = "Gagal (API): " + (rawJson.msg || rawJson.message || "Sistem Menolak");
              tugas.selesai = true; simpanStorage(); renderLayarHistory(); return;
          }

          var jsonStatus = rawJson.data ? rawJson.data : rawJson;
          var st = jsonStatus.status ? jsonStatus.status.toUpperCase() : "";

          var isFailed = (
              st === "FAILED" || st === "ERROR" || st.includes("FAIL") || 
              jsonStatus.errorMessage || jsonStatus.failedReason || jsonStatus.errorCode
          );

          if (isFailed) {
             clearInterval(cekInterval); 
             var pesanAsli = "Ditolak Server GPU.";
             if (jsonStatus.failedReason && jsonStatus.failedReason.exception_message) {
                 pesanAsli = "Node " + (jsonStatus.failedReason.node_id||"?") + ": " + jsonStatus.failedReason.exception_message;
             } else if (jsonStatus.errorMessage) {
                 pesanAsli = jsonStatus.errorMessage;
             }

             tugas.status = "Gagal: " + pesanAsli.substring(0, 45);
             tugas.selesai = true; tugas.progress = null; 
             simpanStorage(); if (navLayarAktif === 'history') renderLayarHistory();
             return; 
          }
          
          if (st === "SUCCESS" && jsonStatus.results && jsonStatus.results.length > 0) {
              clearInterval(cekInterval); 
              tugas.status = "Selesai";
              tugas.selesai = true; tugas.progress = 100;
              tugas.videoUrl = jsonStatus.results[0].url; 
              simpanStorage(); if (navLayarAktif === 'history') renderLayarHistory();
              tampilkanNotif('Render video sukses 100%!', 'sukses');
              return; 
          }
          
          if (st === "QUEUED") {
              tugas.status = "Mengantre di GPU...";
          } else if (st === "RUNNING") {
              if (tugas.progress < 95) tugas.progress += Math.floor(Math.random() * 5) + 2; 
              tugas.status = "Sedang Render di GPU (" + tugas.progress + "%)";
          }
          
          simpanStorage(); if (navLayarAktif === 'history') renderLayarHistory();
        } catch (err) { 
           console.warn("CCTV error:", err); 
        }
      }, 8000); 
    }

    async function mulaiProsesGenerate() {
      var akunAktif = akunRunningHub[0];
      if (!akunAktif) return tampilkanNotif('Hubungkan akun terlebih dahulu!', 'error');
      if (!urlBahanFoto || !urlBahanVideo) return tampilkanNotif('Foto dan Video harus diunggah!', 'error');

      var btn = document.getElementById('btn-submit-generate');
      btn.disabled = true; btn.innerText = "⚡ MENGIRIM TUGAS...";

      try {
        var nodeParams = [
          { nodeId: "30", fieldName: "image", fieldValue: urlBahanFoto },
          { nodeId: "33", fieldName: "video", fieldValue: urlBahanVideo }
        ];

        var payloadKirim = {
          randomSeed: true,
          instanceType: "default",
          nodeInfoList: nodeParams,
          retainSeconds: 0,
          usePersonalQueue: false
        };

        var res = await fetch('https://www.runninghub.ai/openapi/v2/run/workflow/' + RUNNINGHUB_WORKFLOW_ID, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + akunAktif.key },
          body: JSON.stringify(payloadKirim)
        });
        
        var data = await res.json();
        
        if (data && data.taskId) { 
          tampilkanNotif('Tugas berhasil dikirim ke GPU!', 'sukses');
          var tugasBaru = {
            id: data.taskId, key: akunAktif.key, model: "MotionFly HD (v6)", prov: "RunningHub", tgl: "Baru saja",
            videoUrl: null, status: "Masuk Antrean (0%)", selesai: false, progress: 0
          };
          riwayatGenerateList.unshift(tugasBaru); simpanStorage(); gantiLayarNav('history');
          pantauTaskRunningHub(tugasBaru, akunAktif.key);
        } else { 
          tampilkanNotif('GAGAL KIRIM: ' + (data.errorMessage || data.msg), 'error');
        }
      } catch (e) { 
        tampilkanNotif('Koneksi Gagal: ' + e.message, 'error'); 
      } finally {
        btn.innerText = "GENERATE VIDEO"; btn.disabled = false;
      }
    }

    function renderLayarHistory() {
      var wadah = document.getElementById('wadah-list-history');
      if (!wadah) return; wadah.innerHTML = '';
      
      if (riwayatGenerateList.length === 0) {
        wadah.innerHTML = '<div class="p-12 text-center text-slate-400 text-sm border-2 border-dashed border-kmBorder rounded-3xl bg-white">Belum ada riwayat.</div>'; return;
      }
      
      riwayatGenerateList.forEach(function(itm) {
        var isDone = itm.selesai, isFailed = itm.status.includes("Gagal") || rtStatusFailed(itm.status);
        var card = document.createElement('div');
        card.className = "bg-white border border-kmBorder p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 modern-shadow";
        
        var iconStat = isFailed ? '❌' : (isDone ? '▶' : '⏳');
        var badgeHTML = '';

        if (isDone && !isFailed) {
            badgeHTML = '<span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">✓ Selesai 100%</span>' +
            '<button type="button" onclick="window.open(\'' + itm.videoUrl + '\', \'_blank\')" class="px-4 py-2 text-xs font-bold bg-slate-100 text-slate-700 rounded-xl">Putar</button>' +
            '<a href="' + itm.videoUrl + '" target="_blank" download class="px-4 py-2 text-xs font-bold bg-kmViolet text-white rounded-xl">Download</a>';
        } else if (isFailed) {
            badgeHTML = '<span class="text-xs bg-rose-50 text-rose-700 border border-rose-200 px-3 py-1 rounded-full font-bold">' + itm.status + '</span>';
        } else {
            badgeHTML = '<span class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full font-bold animate-pulse">' + itm.status + '</span>';
        }

        card.innerHTML = '<div class="flex items-center gap-4">' +
          '<div class="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center font-bold text-lg">' + iconStat + '</div>' +
          '<div><div class="text-base font-bold text-kmTextPrimary">' + itm.model + '</div>' +
          '<div class="text-xs text-kmTextSecondary mt-1">ID: ' + itm.id + '</div></div></div>' +
          '<div class="flex items-center gap-2.5 shrink-0">' + badgeHTML + '</div>';
        wadah.appendChild(card);
      });
    }

    function rtStatusFailed(st) { return st && (st.includes('Gagal') || st.includes('Error') || st.includes('FAIL')); }

    function bersihkanSemuaHistory() {
      mintaKonfirmasi('Hapus seluruh riwayat?', function() { riwayatGenerateList = []; simpanStorage(); renderLayarHistory(); });
    }

    function renderListAkunDiKelola() {
      var wadah = document.getElementById('wadah-kartu-akun-list');
      if (!wadah) return; wadah.innerHTML = ''; 
      
      akunRunningHub.forEach(function(a, i) {
        var el = document.createElement('div'); el.className = "bg-white border border-kmBorder p-4 rounded-2xl flex items-center justify-between modern-shadow";
        el.innerHTML = '<div class="flex items-center gap-3.5"><span class="w-3 h-3 rounded-full bg-emerald-500"></span><span class="font-bold text-kmTextPrimary">' + a.nama + '</span></div>' +
          '<div class="flex items-center gap-3"><span class="text-sm font-black text-kmViolet bg-violet-50 px-3 py-1 rounded-xl">' + a.koin + ' koin</span><button onclick="hapusAkunSatu(' + i + ')" class="text-rose-500 text-xs font-bold">Hapus</button></div>';
        wadah.appendChild(el);
      });
    }

    function hapusAkunSatu(idx) {
      mintaKonfirmasi("Hapus akun ini?", function() { akunRunningHub.splice(idx, 1); simpanStorage(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate(); });
    }

    function bukaModalFormKey() { document.getElementById('modal-popup-key').style.display = 'flex'; }
    function tutupModalFormKey() { document.getElementById('modal-popup-key').style.display = 'none'; }

    async function simpanAkunBaruDariModal() {
      var valKey = document.getElementById('in-modal-key').value.trim();
      if (!valKey) return;
      var btn = document.getElementById('btn-simpan-key');
      btn.innerText = 'Menyinkronkan...'; btn.disabled = true;

      var saldo = 0;
      try {
        var res = await fetch('/api/saldo?apiKey=' + encodeURIComponent(valKey));
        var hasil = await res.json();
        if (hasil && hasil.data) saldo = Number(hasil.data.remainCoins || hasil.data.coins || hasil.data.balance || 0);
      } catch (err) {}

      btn.innerText = 'Simpan API Key'; btn.disabled = false;
      akunRunningHub.push({ nama: 'RunningHub', key: valKey, koin: saldo });
      simpanStorage(); tutupModalFormKey(); renderListAkunDiKelola(); sinkronkanDropdownAkunGenerate();
      tampilkanNotif('Akun terhubung!', 'sukses');
    }

    window.onload = function() { muatStorage(); };
  </script>
</head>

<body class="pb-14">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end pointer-events-none"></div>

  <header id="main-header-nav" class="border-b border-kmBorder bg-white/90 backdrop-blur-md px-4 py-3.5 flex items-center justify-between sticky top-0 z-40">
    <div class="font-black text-kmTextPrimary">KiixMotion V6.0</div>
    <nav class="flex items-center gap-1">
      <button id="menu-nav-dash" onclick="gantiLayarNav('dashboard')" class="px-3 py-2 rounded-xl text-xs font-semibold">Dashboard</button>
      <button id="menu-nav-gene" onclick="gantiLayarNav('generate')" class="px-3 py-2 rounded-xl text-xs font-semibold">Generate</button>
      <button id="menu-nav-hist" onclick="gantiLayarNav('history')" class="px-3 py-2 rounded-xl text-xs font-semibold">History</button>
      <button id="menu-nav-kelo" onclick="gantiLayarNav('kelola-akun')" class="px-3 py-2 rounded-xl text-xs font-semibold">Akun</button>
    </nav>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 space-y-6">
    <div id="layar-dashboard" style="display: none;" class="space-y-6">
      <div class="bg-white border border-kmBorder p-5 rounded-3xl modern-shadow text-center space-y-2">
        <h3 class="text-sm font-bold text-slate-500">Total Koin Tersedia</h3>
        <div id="dash-rh-total-koin" class="text-3xl font-black text-kmViolet">0</div>
      </div>
    </div>

    <div id="layar-generate" class="space-y-6">
      <div class="bg-white border border-kmBorder p-6 rounded-3xl space-y-5 modern-shadow">
        <h2 class="font-bold text-kmTextPrimary">1. Bahan Input (Full URL Mode)</h2>
        <div class="grid grid-cols-2 gap-4">
          <label class="border-2 border-dashed border-kmBorder rounded-2xl p-5 text-center cursor-pointer bg-slate-50">
            <span class="text-3xl">🖼️</span><br>
            <span id="txt-file-foto" class="text-xs font-bold mt-2 block">Foto Karakter</span>
            <span id="st-file-foto" class="text-[10px] text-slate-400">Klik untuk upload</span>
            <input type="file" accept="image/*" class="hidden" onchange="unggahBahanLangsung(this, 'foto')" />
          </label>
          <label class="border-2 border-dashed border-kmBorder rounded-2xl p-5 text-center cursor-pointer bg-slate-50">
            <span class="text-3xl">🎬</span><br>
            <span id="txt-file-video" class="text-xs font-bold mt-2 block">Video Gerakan</span>
            <span id="st-file-video" class="text-[10px] text-slate-400">Klik untuk upload</span>
            <input type="file" accept="video/*" class="hidden" onchange="unggahBahanLangsung(this, 'video')" />
          </label>
        </div>
      </div>

      <div class="bg-white border border-kmBorder p-6 rounded-3xl space-y-5 modern-shadow">
        <select id="sel-dropdown-akun" class="w-full bg-slate-50 border border-kmBorder rounded-2xl px-4 py-3 text-sm focus:outline-none"></select>
        <button id="btn-submit-generate" onclick="mulaiProsesGenerate()" class="w-full py-4 bg-kmViolet text-white font-extrabold text-sm rounded-2xl violet-glow active:scale-95 transition">GENERATE VIDEO</button>
      </div>
    </div>

    <div id="layar-history" style="display: none;" class="space-y-4">
      <div class="flex items-center justify-between bg-white p-5 rounded-3xl border border-kmBorder">
        <h2 class="font-bold text-kmTextPrimary">Riwayat Video</h2>
        <button onclick="bersihkanSemuaHistory()" class="text-xs text-rose-500 font-bold">Hapus Semua</button>
      </div>
      <div id="wadah-list-history" class="space-y-3"></div>
    </div>

    <div id="layar-kelola-akun" style="display: none;" class="space-y-6">
      <button onclick="bukaModalFormKey()" class="w-full py-4 bg-kmViolet text-white font-bold rounded-2xl violet-glow">+ Tambah API Key</button>
      <div id="wadah-kartu-akun-list" class="space-y-3"></div>
    </div>
  </main>

  <div id="modal-popup-key" style="display: none;" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-kmBorder max-w-sm w-full p-6 rounded-3xl space-y-5">
      <h3 class="text-lg font-bold">Tambah API Key</h3>
      <input id="in-modal-key" type="password" placeholder="Tempel API Key di sini..." class="w-full bg-slate-50 border border-kmBorder rounded-2xl px-4 py-3" />
      <div class="flex gap-3 pt-2">
        <button onclick="tutupModalFormKey()" class="flex-1 py-3 bg-slate-100 font-bold rounded-2xl">Batal</button>
        <button id="btn-simpan-key" onclick="simpanAkunBaruDariModal()" class="flex-1 py-3 bg-kmViolet text-white font-bold rounded-2xl">Simpan</button>
      </div>
    </div>
  </div>

  <div id="modal-konfirmasi-box" style="display: none;" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-kmBorder max-w-xs w-full p-6 rounded-3xl space-y-4 text-center">
      <p id="modal-konfirmasi-teks" class="text-sm font-semibold">Lanjutkan?</p>
      <div class="flex gap-2.5 pt-2">
        <button onclick="tutupModalKonfirmasi(false)" class="flex-1 py-2.5 bg-slate-100 font-bold rounded-xl">Batal</button>
        <button onclick="tutupModalKonfirmasi(true)" class="flex-1 py-2.5 bg-rose-600 text-white font-bold rounded-xl">Ya</button>
      </div>
    </div>
  </div>
</body>
</html>
