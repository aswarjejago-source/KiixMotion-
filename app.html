<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KiixMotion Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        colors: { kmBg: '#F8FAFC', kmCard: '#FFFFFF', kmBorder: '#E2E8F0', kmTextPrimary: '#0F172A', kmTextSecondary: '#64748B', kmViolet: '#7C3AED', kmVioletHover: '#6D28D9', kmVioletLight: '#F3EEFF' } } }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .modern-shadow { box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 4px 6px -2px rgba(15, 23, 42, 0.02); }
    .violet-glow { box-shadow: 0 8px 24px -4px rgba(124, 58, 237, 0.35); }
  </style>
  <script>
    var akunRunningHub = [], akunRoboneo = [], riwayatGenerateList = [];
    var navLayarAktif = 'dashboard', engineProvider = 'runninghub', tabAkunAktif = 'runninghub', isModePilih = false;
    var RUNNINGHUB_WORKFLOW_ID = "2096475206973194241";
    var linkTelegramResmi = "https://t.me/KiixMotionStudio";
    var userReferralCode = "KIIX-VIP" + Math.floor(100 + Math.random() * 900);
    var urlBahanFoto = null, urlBahanVideo = null;

    function muatStorage() {
      try {
        var sRH = localStorage.getItem('km_rh_data'), sRB = localStorage.getItem('km_rb_data');
        var sHist = localStorage.getItem('km_hist_data'), sRef = localStorage.getItem('km_my_ref_code');
        if (sRH) akunRunningHub = JSON.parse(sRH);
        if (sRB) akunRoboneo = JSON.parse(sRB);
        if (sHist) riwayatGenerateList = JSON.parse(sHist);
        if (sRef) { userReferralCode = sRef; } else { localStorage.setItem('km_my_ref_code', userReferralCode); }
      } catch (e) { console.error(e); }
      sinkronkanDropdownAkunGenerate(); updateStatistikDashboard();
      var elRef = document.getElementById('dash-ref-code-txt'); if (elRef) elRef.innerText = userReferralCode;

      riwayatGenerateList.forEach(function(t) {
        if (!t.selesai && t.id && t.prov === "RunningHub") {
          var k = t.key || (akunRunningHub[0] ? akunRunningHub[0].key : null);
          if (k) pantauTaskRunningHub(t, k);
        }
      });
    }

    function simpanStorage() {
      try {
        localStorage.setItem('km_rh_data', JSON.stringify(akunRunningHub));
        localStorage.setItem('km_rb_data', JSON.stringify(akunRoboneo));
        localStorage.setItem('km_hist_data', JSON.stringify(riwayatGenerateList));
      } catch (e) { console.error(e); }
      updateStatistikDashboard();
    }

    function gantiLayarNav(layar) {
      navLayarAktif = layar;
      var ids = ['dashboard', 'generate', 'history', 'kelola-akun'];
      ids.forEach(function(id) {
        var el = document.getElementById('layar-' + id), btn = document.getElementById('menu-nav-' + id.slice(0, 4));
        if (el) el.style.display = (layar === id) ? 'block' : 'none';
        if (btn) btn.className = "px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer " +
          ((layar === id) ? "bg-kmViolet text-white violet-glow" : "text-kmTextSecondary hover:text-kmViolet hover:bg-slate-100/80");
      });
      if (layar === 'dashboard') updateStatistikDashboard();
      if (layar === 'history') renderLayarHistory();
      if (layar === 'kelola-akun') renderListAkunDiKelola();
    }

    async function segarkanSaldoRunningHub(akun, apiKey) {
      try {
        var res = await fetch('/api/saldo?apiKey=' + encodeURIComponent(apiKey));
        var hasil = await res.json();
        if (hasil && hasil.data) {
          var k = hasil.data.remainCoins !== undefined ? hasil.data.remainCoins : (hasil.data.coins !== undefined ? hasil.data.coins : hasil.data.balance);
          if (k !== undefined && k !== null) {
            akun.koin = Number(k);
            simpanStorage(); updateStatistikDashboard(); sinkronkanDropdownAkunGenerate();
          }
        }
      } catch (err) { console.warn("Gagal segarkan saldo:", err); }
    }

    function updateStatistikDashboard() {
      var totalRhKoin = 0, maxRhKoin = 0, totalRbCarrots = 0, maxRbCarrots = 0;
      akunRunningHub.forEach(function(a) { var k = Number(a.koin) || 0; totalRhKoin += k; if (k > maxRhKoin) maxRhKoin = k; });
      akunRoboneo.forEach(function(r) { var c = Number(r.koin) || 0; totalRbCarrots += c; if (c > maxRbCarrots) maxRbCarrots = c; });
      var setTxt = function(id, val) { var el = document.getElementById(id); if (el) el.innerText = val; };
      setTxt('dash-rh-total-koin', totalRhKoin); setTxt('dash-rh-total-akun', akunRunningHub.length + "/" + akunRunningHub.length);
      setTxt('dash-rh-max-koin', maxRhKoin); setTxt('dash-rb-total-carrots', totalRbCarrots);
      setTxt('dash-rb-total-akun', akunRoboneo.length + "/" + akunRoboneo.length); setTxt('dash-rb-max-carrots', maxRbCarrots);
      setTxt('dash-stat-video-selesai', riwayatGenerateList.filter(function(r){ return r.selesai; }).length);
    }

    function bukaGrupTelegram() { window.open(linkTelegramResmi, '_blank'); }
    function salinKodeReferral() {
      var linkUndang = window.location.origin + "/app.html?ref=" + userReferralCode;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(linkUndang).then(function() { alert('✓ Link referral berhasil disalin:\n' + linkUndang); });
      } else { prompt("Salin link referral kamu:", linkUndang); }
    }
    function bukaModalReferral() { document.getElementById('modal-referral-info').style.display = 'flex'; }
    function tutupModalReferral() { document.getElementById('modal-referral-info').style.display = 'none'; }

    function setProviderUtama(p) {
      engineProvider = p;
      var provs = ['runninghub', 'roboneo', 'kiix'];
      provs.forEach(function(pr) {
        var card = document.getElementById('c-prov-' + pr), badge = document.getElementById('b-prov-' + pr);
        if (card) card.className = (pr === p) ? "bg-white border-2 border-kmViolet p-5 rounded-2xl cursor-pointer modern-shadow ring-4 ring-violet-50 transition" : "bg-kmCard border border-slate-200/80 p-5 rounded-2xl cursor-pointer hover:border-violet-300 transition modern-shadow";
        if (badge) badge.style.display = (pr === p) ? 'inline-block' : 'none';
      });
      var setTxt = function(id, v) { var el = document.getElementById(id); if (el) el.innerText = v; };
      var dropWrap = document.getElementById('box-wrap-dropdown-akun');
      if (p === 'roboneo') {
        setTxt('t-engine-title', "KLING 2.6 MOTION CONTROL"); setTxt('t-engine-sub', "(ROBONEO)");
        setTxt('t-engine-cost', "≈ 4 carrots"); setTxt('t-engine-total', "≈ 4 carrots");
        if (dropWrap) dropWrap.style.display = 'block';
      } else if (p === 'kiix') {
        setTxt('t-engine-title', "KIIXMOTION DIRECT CLOUD"); setTxt('t-engine-sub', "(DIRECT ENGINE)");
        setTxt('t-engine-cost', "1 Kredit VIP"); setTxt('t-engine-total', "1 kredit VIP");
        if (dropWrap) dropWrap.style.display = 'none';
      } else {
        setTxt('t-engine-title', "WAN MOTION CONTROL 1080HD"); setTxt('t-engine-sub', "(RUNNINGHUB)");
        setTxt('t-engine-cost', "≈ 478 kredit"); setTxt('t-engine-total', "≈ 478 kredit");
        if (dropWrap) dropWrap.style.display = 'block';
      }
      sinkronkanDropdownAkunGenerate();
    }

    function switchBahanInput(mode) {
      var bu = document.getElementById('tab-u'), bt = document.getElementById('tab-t');
      var vu = document.getElementById('v-mode-upload'), vt = document.getElementById('v-mode-tiktok');
      if (vu) vu.style.display = (mode === 'u') ? "grid" : "none";
      if (vt) vt.style.display = (mode === 'u') ? "none" : "block";
      if (bu) bu.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold " + ((mode === 'u') ? "bg-white text-kmViolet shadow-sm" : "text-slate-500 hover:text-slate-800") + " cursor-pointer";
      if (bt) bt.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold " + ((mode === 't') ? "bg-white text-kmViolet shadow-sm" : "text-slate-500 hover:text-slate-800") + " cursor-pointer";
    }

    function unggahBahanLangsung(input, tipe) {
      if (!input.files || !input.files[0]) return;
      var targetAkun = (engineProvider === 'roboneo') ? akunRoboneo : akunRunningHub;
      if (engineProvider !== 'kiix' && targetAkun.length === 0) {
        input.value = "";
        return alert('Hubungkan akun RunningHub terlebih dahulu di menu Akun!');
      }
      var sel = document.getElementById('sel-dropdown-akun'), idx = sel ? sel.value : "";
      var akunAktif = (idx === "random" || idx === "") ? targetAkun[0] : targetAkun[parseInt(idx, 10)];
      var file = input.files[0];
      var txtEl = document.getElementById(tipe === 'foto' ? 'txt-file-foto' : 'txt-file-video');
      var stEl = document.getElementById(tipe === 'foto' ? 'st-file-foto' : 'st-file-video');
      if (txtEl) txtEl.innerText = file.name;
      if (stEl) stEl.innerHTML = '<span class="text-amber-600 font-bold animate-pulse">⏳ Mengunggah: 0%</span>';

      var formData = new FormData();
      formData.append("apiKey", akunAktif.key);
      formData.append("fileType", tipe === 'foto' ? 'image' : 'video');
      formData.append("file", file);

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "https://www.runninghub.ai/task/openapi/upload");
      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable && stEl) {
          var pct = Math.round((e.loaded / e.total) * 100);
          stEl.innerHTML = '<span class="text-amber-600 font-bold animate-pulse">⏳ Mengunggah: ' + pct + '%</span>';
        }
      };
      xhr.onload = function() {
        try {
          var json = JSON.parse(xhr.responseText);
          var serverFile = (json && json.data && (json.data.fileName || json.data.fileUrl)) ? (json.data.fileName || json.data.fileUrl) : null;
          if (serverFile) {
            if (tipe === 'foto') urlBahanFoto = serverFile; else urlBahanVideo = serverFile;
            var ukuranMb = (file.size / (1024 * 1024)).toFixed(1);
            if (stEl) stEl.innerHTML = '<span class="text-emerald-600 font-bold">✓ Terunggah (' + ukuranMb + ' MB)</span>';
          } else {
            throw new Error((json && json.msg) || "Format tidak didukung");
          }
        } catch(err) {
          if (stEl) stEl.innerHTML = '<span class="text-rose-600 font-bold">❌ Gagal Unggah</span>';
          alert('Gagal unggah ' + tipe + ': ' + err.message);
        }
      };
      xhr.onerror = function() {
        if (stEl) stEl.innerHTML = '<span class="text-rose-600 font-bold">❌ Gagal Jaringan</span>';
        alert('Koneksi internet bermasalah saat unggah ' + tipe);
      };
      xhr.send(formData);
    }

    function tempelLinkTiktok() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function(t) {
          if (t) { var el = document.getElementById('in-link-tiktok'); if (el) el.value = t; alert('Link TikTok berhasil ditempel!'); }
        });
      }
    }

    function sinkronkanDropdownAkunGenerate() {
      var sel = document.getElementById('sel-dropdown-akun'), badge = document.getElementById('badge-total-saldo-gen');
      var targetAkun = (engineProvider === 'roboneo') ? akunRoboneo : akunRunningHub;
      if (!sel) return;
      sel.innerHTML = '';
      if (targetAkun.length === 0) {
        var opt = document.createElement('option'); opt.value = ""; opt.innerText = "Belum ada akun terhubung (0 koin)"; sel.appendChild(opt);
        if (badge) { badge.innerText = "0 koin"; badge.className = "text-xs font-mono text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg"; }
      } else {
        var optRand = document.createElement('option'); optRand.value = "random"; optRand.innerText = "🎲 Otomatis (Pilih Acak Akun)"; sel.appendChild(optRand);
        var total = 0;
        targetAkun.forEach(function(a, idx) {
          var koinVal = Number(a.koin) || 0;
          total += koinVal;
          var o = document.createElement('option'); o.value = idx; o.innerText = a.nama + " (" + koinVal + (engineProvider === 'roboneo' ? " carrots)" : " koin)"); sel.appendChild(o);
        });
        if (badge) {
          badge.innerText = total + (engineProvider === 'roboneo' ? " carrots" : " koin");
          badge.className = "text-xs font-mono font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg";
        }
      }
    }

    function pantauTaskRunningHub(tugas, apiKey) {
      var cekInterval = setInterval(async function() {
        try {
          var resStatus = await fetch('https://www.runninghub.ai/task/openapi/outputs?taskId=' + tugas.id, {
            headers: { 'Authorization': 'Bearer ' + apiKey }
          });
          var jsonStatus = await resStatus.json();
          if (jsonStatus && jsonStatus.data) {
            var st = jsonStatus.data.taskStatus;
            if (st === "SUCCESS") {
              clearInterval(cekInterval); tugas.status = "Selesai"; tugas.selesai = true;
              var vUrl = jsonStatus.data.fileUrl || (jsonStatus.data.outputs && jsonStatus.data.outputs[0] ? jsonStatus.data.outputs[0].fileUrl : null);
              tugas.videoUrl = vUrl;
              simpanStorage();
              var targetAkun = akunRunningHub.find(function(a) { return a.key === apiKey; });
              if (targetAkun) await segarkanSaldoRunningHub(targetAkun, apiKey);
              if (navLayarAktif === 'history') renderLayarHistory();
            } else if (st === "FAILED") {
              clearInterval(cekInterval); tugas.status = "Gagal Dirender"; tugas.selesai = true;
              simpanStorage();
              if (navLayarAktif === 'history') renderLayarHistory();
            }
          }
        } catch (err) { console.warn("Polling tertunda:", err); }
      }, 8000);
    }

    async function mulaiProsesGenerate() {
      var targetAkun = (engineProvider === 'roboneo') ? akunRoboneo : akunRunningHub;
      if (engineProvider !== 'kiix' && targetAkun.length === 0) return alert('Hubungkan akun terlebih dahulu di menu Akun!');
      var sel = document.getElementById('sel-dropdown-akun'), idx = sel ? sel.value : "";
      var akunAktif = (idx === "random" || idx === "") ? targetAkun[0] : targetAkun[parseInt(idx, 10)];

      if (!urlBahanFoto || !urlBahanVideo) {
        return alert('Harap tunggu! Foto Karakter DAN Video Gerakan keduanya harus selesai diunggah 100%!');
      }

      var btn = document.getElementById('btn-submit-generate');
      if (btn) { btn.disabled = true; btn.innerText = "⚡ MENGIRIM WORKFLOW KE GPU..."; }
      var taskIdAsli = null;

      if (engineProvider === 'runninghub') {
        try {
          var promptTxt = document.querySelector('textarea') ? document.querySelector('textarea').value.trim() : "";
          var promptFinal = promptTxt || "Follow reference video accurately. High detail, smooth movement.";

          // Workflow Wan Motion Control: 3, 89, 308, 444
          var nodeParams = [
            { nodeId: "3", fieldName: "text", fieldValue: promptFinal },
            { nodeId: "89", fieldName: "image", fieldValue: urlBahanVideo },
            { nodeId: "308", fieldName: "image", fieldValue: urlBahanFoto },
            { nodeId: "444", fieldName: "image", fieldValue: urlBahanFoto }
          ];

          var res = await fetch('https://www.runninghub.ai/task/openapi/create', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + akunAktif.key
            },
            body: JSON.stringify({ 
              workflowId: RUNNINGHUB_WORKFLOW_ID, 
              apiKey: akunAktif.key,
              nodeInfoList: nodeParams 
            })
          });
          var data = await res.json();
          if (data && (data.code === 0 || data.data) && (data.data?.taskId || data.taskId)) { 
            taskIdAsli = data.data?.taskId || data.taskId; 
          } else { 
            alert('Pesan RunningHub:\n' + (data.msg || JSON.stringify(data))); 
            if (btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; } 
            return; 
          }
        } catch (e) { 
          alert('Proses Gagal: ' + e.message); 
          if (btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; } 
          return; 
        }
      }

      var tugasBaru = {
        id: taskIdAsli || ("RH-" + Date.now().toString().slice(-6)),
        key: akunAktif.key,
        model: "Wan Motion Control 1080HD", prov: "RunningHub",
        tgl: "Baru saja", biaya: "≈ 478 koin", videoUrl: null, status: "Sedang Render di GPU...", selesai: false
      };
      riwayatGenerateList.unshift(tugasBaru); 
      simpanStorage(); 
      gantiLayarNav('history');
      if (btn) { btn.innerText = "GENERATE VIDEO"; btn.disabled = false; }
      if (taskIdAsli) pantauTaskRunningHub(tugasBaru, akunAktif.key);
    }

    function renderLayarHistory() {
      var wadah = document.getElementById('wadah-list-history'), counter = document.getElementById('txt-counter-history');
      if (!wadah) return;
      wadah.innerHTML = ''; if (counter) counter.innerText = riwayatGenerateList.length + " tugas";
      if (riwayatGenerateList.length === 0) {
        wadah.innerHTML = '<div class="p-12 text-center text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-3xl bg-white modern-shadow">Belum ada riwayat generate video.</div>';
        return;
      }
      riwayatGenerateList.forEach(function(itm) {
        var isDone = (itm.selesai === true || itm.status === "Selesai"), hasVideo = Boolean(itm.videoUrl);
        var card = document.createElement('div');
        card.className = "bg-white border border-slate-200/80 p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 modern-shadow";
        card.innerHTML = '<div class="flex items-center gap-4">' +
          '<div class="w-12 h-12 rounded-2xl bg-kmVioletLight text-kmViolet flex items-center justify-center font-bold text-lg shrink-0 shadow-sm">' + (isDone ? '▶' : '⏳') + '</div>' +
          '<div><div class="flex items-center gap-2"><span class="text-base font-bold text-kmTextPrimary">' + itm.model + '</span><span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full font-semibold border border-slate-200">' + itm.prov + '</span></div>' +
          '<div class="text-xs sm:text-sm text-kmTextSecondary mt-1">ID: <span class="text-kmViolet font-mono font-bold">' + itm.id + '</span> • ' + itm.tgl + ' • <span class="text-amber-600 font-bold">' + itm.biaya + '</span></div></div></div>' +
          '<div class="flex items-center gap-2.5 shrink-0 pt-2 sm:pt-0">' +
          (isDone ? (hasVideo ? '<span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">✓ Selesai</span>' +
            '<button type="button" onclick="window.open(\'' + itm.videoUrl + '\', \'_blank\')" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition cursor-pointer">Putar</button>' +
            '<a href="' + itm.videoUrl + '" target="_blank" download="kiixmotion-' + itm.id + '.mp4" class="px-4 py-2 text-xs font-bold bg-kmViolet text-white rounded-xl hover:bg-kmVioletHover transition violet-glow">Download</a>'
            : '<span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">✓ Selesai di GPU</span>')
